<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My at the Institute of Literary Reasearch of the Polish Academy of Sciences</title>

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --border: #d8dee6;
      --accent: #244f7a;
      --accent-light: #e8f0f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    header {
      margin-bottom: 32px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .lead {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 28px 0 22px;
      flex-wrap: wrap;
    }

    input[type="search"] {
      width: min(100%, 420px);
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    .count {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 180px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover,
    .card:focus {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
      outline: none;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    .card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.96rem;
    }

    .filename {
      margin-top: auto;
      display: inline-block;
      width: fit-content;
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--accent-light);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      word-break: break-all;
    }

    .status {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    footer {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.92rem;
    }

    footer a {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main>
    <header>
      <p class="eyebrow">Cezary Rosiński</p>
      <h1>Visualisations</h1>
      <p class="lead">
        Interactive HTML visualisations prepared at the Institute of Literary Reasearch of the Polish Academy of Sciences.
        Select a file below to open the corresponding visualisation.
      </p>
    </header>

    <section class="toolbar" aria-label="Search visualisations">
      <input id="search" type="search" placeholder="Search visualisations…" autocomplete="off">
      <span id="count" class="count"></span>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="status" class="status">Loading HTML files from the repository…</p>

    <footer>
      Repository:
      <a href="https://github.com/cezary-rosinski/IBL-PAN-Python">
        cezary-rosinski/IBL-PAN-Python
      </a>
    </footer>
  </main>

  <script>
    const owner = "cezary-rosinski";
    const repo = "IBL-PAN-Python";
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;

    const knownFiles = {
      "Laboratorium-SBC.html": {
        title: "Laboratorium ŚBC – Humanities Research Sandbox",
        description: "Standalone research sandbox for exploring 20 issues of Berliner Tageblatt from March 1931. Combines catalogue records from the Silesian Digital Library with OCR. Supports concept frequency analysis, entity exploration and page-level co-occurrence networks, with contextual evidence, source references and JSON export."
      }
    };

    const preferredOrder = [
      "Laboratorium-SBC.html"
    ];
	
    const fallbackFiles = preferredOrder.map(name => ({ name, path: name }));

    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const count = document.getElementById("count");

    let allFiles = [];

    function titleFromFilename(name) {
      return name
        .replace(/\.html$/i, "")
        .replace(/^OC_/, "OpenCitations ")
        .replace(/_/g, " ")
        .replace(/\bJS\b/g, "JS")
        .trim();
    }

    function normaliseFiles(files) {
      return files
        .filter(file =>
          file.type === "file" &&
          file.name.toLowerCase().endsWith(".html") &&
          file.name.toLowerCase() !== "index.html" &&
          file.name.toLowerCase() !== "404.html"
        )
        .sort((a, b) => {
          const ai = preferredOrder.indexOf(a.name);
          const bi = preferredOrder.indexOf(b.name);

          if (ai !== -1 && bi !== -1) return ai - bi;
          if (ai !== -1) return -1;
          if (bi !== -1) return 1;

          return a.name.localeCompare(b.name, "en");
        });
    }

    function render(files) {
      const query = search.value.trim().toLowerCase();

      const filtered = files.filter(file => {
        const meta = knownFiles[file.name] || {};
        const searchable = [
          file.name,
          meta.title,
          meta.description
        ].join(" ").toLowerCase();

        return searchable.includes(query);
      });

      grid.innerHTML = "";

      filtered.forEach(file => {
        const meta = knownFiles[file.name] || {};
        const title = meta.title || titleFromFilename(file.name);
        const description = meta.description || "HTML visualisation available in this repository.";

        const card = document.createElement("a");
        card.className = "card";
        card.href = file.path;
        card.innerHTML = `
          <h2>${title}</h2>
          <p>${description}</p>
          <span class="filename">${file.name}</span>
        `;

        grid.appendChild(card);
      });

      count.textContent = `${filtered.length} / ${files.length} HTML files`;

      if (filtered.length === 0) {
        status.textContent = "No matching HTML files found.";
      } else {
        status.textContent = "";
      }
    }

    async function loadFiles() {
      try {
        const response = await fetch(apiUrl, {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }

        const data = await response.json();
        allFiles = normaliseFiles(data);
        render(allFiles);
      } catch (error) {
        console.warn("Could not load repository contents. Using fallback list.", error);
        allFiles = normaliseFiles(fallbackFiles.map(file => ({
          ...file,
          type: "file"
        })));
        status.textContent = "Using fallback list of known HTML files.";
        render(allFiles);
      }
    }

    search.addEventListener("input", () => render(allFiles));
    loadFiles();
  </script>
</body>
</html>
