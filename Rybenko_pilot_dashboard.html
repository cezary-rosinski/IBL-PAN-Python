    const tip = tipFor(box);
    svg.append('g').selectAll('g').data(stack).join('g').attr('fill', (s) => seriesColor(s.key))
      .selectAll('rect').data((s) => s.map((p) => ({...p, key: s.key})).filter((p) => p[1] > p[0])).join('rect')
      .attr('x', (p) => x(p.data.day)).attr('width', x.bandwidth())
      .attr('y', (p) => y(p[1])).attr('height', (p) => Math.max(0, y(p[0]) - y(p[1]) - 2)).attr('rx', 2)
      .style('cursor', 'pointer')
      .on('mousemove', (ev, p) => showTip(box, tip, ev, T('dayLong', p.data.day), [[trSeries(p.key), T('letterCount', p[1] - p[0])], [T('dayTotal'), String(d3.sum(series, (s) => p.data[s]))]]))
      .on('mouseleave', () => hideTip(tip))
      .on('click', (ev, p) => filterLetters({series: p.key, day: String(p.data.day)}));
    const totals = svg.append('g');
    wide.forEach((o) => { const t = d3.sum(series, (s) => o[s]); if (t) totals.append('text').attr('x', x(o.day) + x.bandwidth() / 2).attr('y', y(t) - 4).attr('text-anchor', 'middle').attr('font-size', 11).attr('fill', css('--fg2')).text(t); });
    document.getElementById('days-legend').replaceChildren(...series.map((s) => { const sp = el('span', {text: trSeries(s)}); sp.style.setProperty('--sw', seriesColor(s)); return sp; }));
  }

  // ---------- intermediaries ----------
  function drawInterm() {
    const box = document.getElementById('interm');
    box.replaceChildren();
    const m = new Map();
    L.forEach((r) => r.intermediaries.forEach((p) => m.set(p, (m.get(p) || []).concat(r.n))));
    const rows = [...m].map(([person, ls]) => ({person, n: ls.length, ls})).sort((a, b) => b.n - a.n);
    const W = box.clientWidth || 520, bh = 28, H = rows.length * bh + 8;
    const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', T('ariaInterm'));
    const meas = svg.append('text').attr('font-size', 12);
    const lw = Math.min(W * 0.58, d3.max(rows, (r) => { meas.text(r.person); return meas.node().getComputedTextLength(); }) + 12);
    meas.remove();
    const x = d3.scaleLinear([0, d3.max(rows, (r) => r.n) || 1], [lw, W - 34]);
    const tip = tipFor(box);
    const g = svg.selectAll('g').data(rows).join('g').attr('transform', (r, i) => `translate(0,${i * bh + 4})`).style('cursor', 'pointer')
      .on('mousemove', (ev, r) => showTip(box, tip, ev, r.person, [[T('letters'), r.ls.join(', ')]]))
      .on('mouseleave', () => hideTip(tip))
      .on('click', (ev, r) => filterLetters({q: r.person.split(',')[0]}));
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', bh).attr('fill', 'transparent');
    g.append('text').attr('x', lw - 8).attr('y', bh / 2).attr('dy', '0.32em').attr('text-anchor', 'end').attr('font-size', 12).attr('fill', css('--fg')).text((r) => r.person.length > 44 ? r.person.slice(0, 43) + '…' : r.person);
    g.append('rect').attr('x', lw).attr('y', 6).attr('height', bh - 12).attr('rx', 3).attr('width', (r) => Math.max(2, x(r.n) - lw)).attr('fill', (r, i) => i < 2 ? slot(0) : css('--muted-mark'));
    g.append('text').attr('x', (r) => x(r.n) + 6).attr('y', bh / 2).attr('dy', '0.32em').attr('font-size', 12).attr('fill', css('--fg2')).text((r) => r.n);
  }

  // ---------- heatmap ----------
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  function drawHeat() {
    const box = document.getElementById('heat');
    box.replaceChildren();
    const series = SERIES.filter((s) => L.some((r) => r.series === s));
    const cells = [];
    const m = new Map();
    L.forEach((r) => r.topics.forEach((t) => { const k = r.series + '|' + t; m.set(k, (m.get(k) || []).concat(r.n)); }));
    m.forEach((ls, k) => { const [s, t] = k.split('|'); cells.push({series: s, topic: t, n: ls.length, ls}); });
    const tot = d3.rollup(cells, (v) => d3.sum(v, (c) => c.n), (c) => c.topic);
    const topics = [...tot.keys()].sort((a, b) => tot.get(b) - tot.get(a));
    const W = Math.max(box.clientWidth || 900, 560);
    const svg = d3.select(box).append('svg').attr('width', '100%').attr('role', 'img').attr('aria-label', T('ariaHeat'));
    const meas = svg.append('text').attr('font-size', 12);
    const lw = Math.min(W * 0.36, d3.max(topics, (t) => { meas.text(trTopic(t)); return meas.node().getComputedTextLength(); }) + 12);
    meas.remove();
    const top = 56, ch = 24, H = top + topics.length * ch + 6, right = 40;
    svg.attr('viewBox', `0 0 ${W} ${H}`);
    const x = d3.scaleBand(series, [lw, W - right]).padding(0.05);
    const y = d3.scaleBand(topics, [top, H - 6]).padding(0.08);
    const max = d3.max(cells, (c) => c.n) || 1;
    const ramp = d3.interpolateRgb(css('--seq0'), css('--seq1'));
    const tip = tipFor(box);
    const hdr = svg.append('g');
    series.forEach((s0) => {
      const s = trSeries(s0);
      const parts = /\(/.test(s) ? s.replace(/\s\((.+)\)$/, '|($1)').split('|') : s.split(' ');
      const t = hdr.append('text').attr('x', x(s0) + x.bandwidth() / 2).attr('y', top - 26).attr('text-anchor', 'middle').attr('font-size', 11).attr('fill', css('--fg2'));
      t.append('tspan').text(parts[0]);
      if (parts[1]) t.append('tspan').attr('x', x(s0) + x.bandwidth() / 2).attr('dy', '1.25em').text(parts.slice(1).join(' '));
    });
    svg.append('g').selectAll('text').data(topics).join('text').attr('x', lw - 8).attr('y', (t) => y(t) + y.bandwidth() / 2).attr('dy', '0.32em')
      .attr('text-anchor', 'end').attr('font-size', 12).attr('fill', css('--fg')).text((t) => trTopic(t));
    const g = svg.append('g').selectAll('g').data(cells).join('g').style('cursor', 'pointer')
      .on('mousemove', (ev, c) => showTip(box, tip, ev, trTopic(c.topic), [[trSeries(c.series), T('letterCount', c.n)], [T('letters'), c.ls.join(', ')]]))
      .on('mouseleave', () => hideTip(tip))
      .on('click', (ev, c) => filterLetters({series: c.series, topic: c.topic}));
    g.append('rect').attr('x', (c) => x(c.series)).attr('y', (c) => y(c.topic)).attr('width', x.bandwidth()).attr('height', y.bandwidth()).attr('rx', 3)
      .attr('fill', (c) => ramp(0.12 + 0.88 * c.n / max));
    g.append('text').attr('x', (c) => x(c.series) + x.bandwidth() / 2).attr('y', (c) => y(c.topic) + y.bandwidth() / 2).attr('dy', '0.32em').attr('text-anchor', 'middle')
      .attr('font-size', 11).style('pointer-events', 'none')
      .attr('fill', (c) => { const dark = isDark(); return dark ? (c.n / max > 0.5 ? '#0b0b0b' : '#f0efec') : (c.n / max > 0.5 ? '#ffffff' : '#0b0b0b'); })
      .text((c) => c.n);
  }

  function drawOverview() { drawKpis(); drawDays(); drawInterm(); drawHeat(); }

  // ---------- network ----------
  const NS = {kind: 'persons', min: 1, iso: false, addr: true, sel: null, q: '', zoom: null, svg: null};
  const isPerson = (n) => NS.kind === 'persons' || (NS.kind === 'person_topic' && n.kind === 'person');
  const isTopicNode = (n) => NS.kind === 'topics' || (NS.kind === 'person_topic' && n.kind === 'topic');
  const PERSONISH = () => NS.kind === 'persons' || NS.kind === 'person_topic';
  const label = (n) => isTopicNode(n) ? trTopic(n.id) : n.id;
  const roleKey = (n) => n.addr && n.ment ? 'roleBoth' : n.addr ? 'roleAddr' : 'roleMent';
  const ROLE_SLOT = {roleAddr: 0, roleMent: 1, roleBoth: 2};
  const commRank = {};
  Object.entries(DATA.networks).forEach(([k, net]) => {
    const sizes = d3.rollup(net.nodes, (v) => v.length, (n) => n.comm);
    commRank[k] = new Map([...sizes].sort((a, b) => b[1] - a[1]).map(([c], i) => [c, i]));
  });
  const nodeColor = (n) => {
    if (NS.kind === 'person_topic' && n.kind === 'topic') return slot(3);
    if (PERSONISH()) return slot(ROLE_SLOT[roleKey(n)]);
    const r = commRank[NS.kind].get(n.comm);
    return r < 7 ? slot(r) : css('--muted-mark');
  };

  function drawNet() {
    const box = document.getElementById('netbox');
    box.querySelectorAll('svg').forEach((s) => s.remove());
    const net = DATA.networks[NS.kind];
    document.getElementById('net-addr-wrap').hidden = !PERSONISH();
    const drop = new Set(PERSONISH() && !NS.addr ? net.nodes.filter((n) => n.addr && !n.ment).map((n) => n.id) : []);
    const edges = net.edges.filter((e) => e.w >= NS.min && !drop.has(e.s) && !drop.has(e.t)).map((e) => ({...e, source: e.s, target: e.t}));
    const used = new Set(edges.flatMap((e) => [e.s, e.t]));
    const nodes = net.nodes.filter((n) => !drop.has(n.id) && (NS.iso || used.has(n.id))).map((n) => ({...n}));
    const W = box.clientWidth || 900, H = Math.max(460, Math.min(720, Math.round(W * 0.66)));
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`).attr('height', H)
      .attr('role', 'img').attr('aria-label', T('ariaNet') + document.querySelector('#net-kind option:checked').textContent);
    NS.svg = svg;
    if (!nodes.length) { svg.append('text').attr('x', W / 2).attr('y', H / 2).attr('text-anchor', 'middle').attr('fill', css('--fg2')).text(T('noEdges')); legend(); rank(); info(); return; }
    const r = d3.scaleSqrt([0, d3.max(nodes, (n) => n.wdeg) || 1], [4, PERSONISH() ? 18 : 22]);
    const sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(edges).id((n) => n.id).distance((e) => 40 + 30 / e.w).strength(0.35))
      .force('charge', d3.forceManyBody().strength(NS.kind === 'persons' ? -70 : NS.kind === 'person_topic' ? -110 : -260))
      .force('collide', d3.forceCollide((n) => r(n.wdeg) + 3))
      .force('x', d3.forceX(W / 2).strength(PERSONISH() ? 0.06 : 0.04))
      .force('y', d3.forceY(H / 2).strength(PERSONISH() ? 0.09 : 0.06))
      .stop();
    for (let i = 0; i < 400; i++) sim.tick();
    const root = svg.append('g');
    const zoom = d3.zoom().scaleExtent([0.3, 6]).on('zoom', (ev) => { root.attr('transform', ev.transform); labels.attr('font-size', 11 / ev.transform.k).attr('stroke-width', 3 / ev.transform.k); }).on('end', () => labelSet());
    svg.call(zoom); NS.zoom = zoom;
    const xs = d3.extent(nodes, (n) => n.x), ys = d3.extent(nodes, (n) => n.y);
    const k = Math.min(1.6, 0.9 * Math.min(W / Math.max(40, xs[1] - xs[0] + 120), H / Math.max(40, ys[1] - ys[0] + 60)));
    const fit = d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(xs[0] + xs[1]) / 2, -(ys[0] + ys[1]) / 2);
    NS.fit = fit;
    const wsc = d3.scaleLinear([1, d3.max(edges, (e) => e.w) || 1], [0.8, 6]);
    const link = root.append('g').selectAll('line').data(edges).join('line')
      .attr('x1', (e) => e.source.x).attr('y1', (e) => e.source.y).attr('x2', (e) => e.target.x).attr('y2', (e) => e.target.y)
      .attr('stroke', css('--axis')).attr('stroke-opacity', 0.55).attr('stroke-width', (e) => wsc(e.w)).attr('stroke-linecap', 'round');
    const tip = tipFor(box);
    link.on('mousemove', (ev, e) => showTip(box, tip, ev, label(e.source) + ' — ' + label(e.target), [[T('sharedLetters'), e.letters.join(', ')]])).on('mouseleave', () => hideTip(tip));
    const nbr = new Map(nodes.map((n) => [n.id, new Set([n.id])]));
    edges.forEach((e) => { nbr.get(e.source.id).add(e.target.id); nbr.get(e.target.id).add(e.source.id); });
    const node = root.append('g').selectAll('circle').data(nodes).join('circle')
      .attr('cx', (n) => n.x).attr('cy', (n) => n.y).attr('r', (n) => r(n.wdeg)).attr('fill', nodeColor)
      .attr('stroke', css('--bg')).attr('stroke-width', 2).style('cursor', 'pointer')
      .on('mousemove', (ev, n) => { highlight(n.id); showTip(box, tip, ev, label(n), [[T('letters'), n.letters.length + ' (' + n.letters.slice(0, 12).join(', ') + (n.letters.length > 12 ? '…' : '') + ')'], [T('degree'), String(n.degree)], [T('wdeg'), String(n.wdeg)], [T('btw'), fmt3(n.btw)]].concat(isPerson(n) ? [[T('role'), T(roleKey(n))], [T('ident'), n.status || ''], [T('eid'), n.eid || '']] : NS.kind === 'person_topic' ? [[T('type'), T('typeTopic')]] : [])); })
      .on('mouseleave', () => { highlight(NS.sel); hideTip(tip); })
      .on('click', (ev, n) => { ev.stopPropagation(); NS.sel = n.id; highlight(n.id); info(); labelSet(); });
    svg.on('click', () => { NS.sel = null; highlight(null); info(); labelSet(); });
    const W2 = (xs[0] + xs[1]) / 2;
    const right = (n) => n.x > W2 + (xs[1] - xs[0]) * 0.1;
    const labels = root.append('g').selectAll('text').data(nodes).join('text')
      .attr('x', (n) => n.x + (right(n) ? -(r(n.wdeg) + 4) : r(n.wdeg) + 4)).attr('y', (n) => n.y).attr('dy', '0.32em')
      .attr('text-anchor', (n) => right(n) ? 'end' : 'start')
      .attr('font-size', 11).attr('fill', css('--fg')).attr('paint-order', 'stroke').attr('stroke', css('--bg')).attr('stroke-width', 3).attr('stroke-linejoin', 'round')
      .style('pointer-events', 'none')
      .text((n) => { const s = label(n); return s.length > 38 ? s.slice(0, 37) + '…' : s; });
    const topN = NS.kind === 'persons' ? 8 : NS.kind === 'person_topic' ? 12 : 10;
    const topSet = new Set([...nodes].sort((a, b) => b.wdeg - a.wdeg).slice(0, topN).map((n) => n.id));
    const matches = (n, q) => q && (n.id.toLowerCase().includes(q) || label(n).toLowerCase().includes(q));
    function labelSet() {
      const q = NS.q.toLowerCase();
      const show = new Set(topSet);
      if (NS.sel) nbr.get(NS.sel)?.forEach((id) => show.add(id));
      nodes.forEach((n) => { if (matches(n, q)) show.add(n.id); });
      // greedy collision avoidance: always show selected/neighbours/search hits, others only if their box is free
      const kz = d3.zoomTransform(svg.node()).k || 1;
      const placed = [];
      const box = (n) => { const w = Math.min(label(n).length, 38) * 6.1 / kz, h = 13 / kz, rr = r(n.wdeg); const x0 = right(n) ? n.x - rr - 4 - w : n.x + rr + 4; return [x0, n.y - h / 2, x0 + w, n.y + h / 2]; };
      const hitBox = (a) => placed.some((b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1]);
      const forced = new Set(); if (NS.sel) nbr.get(NS.sel)?.forEach((id) => forced.add(id)); nodes.forEach((n) => { if (matches(n, q)) forced.add(n.id); });
      const vis = new Set();
      [...nodes].filter((n) => show.has(n.id)).sort((a, b) => (forced.has(b.id) - forced.has(a.id)) || (b.id === NS.sel) - (a.id === NS.sel) || b.wdeg - a.wdeg).forEach((n) => { const bx = box(n); if (n.id === NS.sel || !hitBox(bx)) { placed.push(bx); vis.add(n.id); } });
      labels.attr('display', (n) => vis.has(n.id) ? null : 'none');
    }
    function highlight(id) {
      const q = NS.q.toLowerCase();
      const hit = (n) => matches(n, q);
      if (!id && !q) { node.attr('opacity', 1); link.attr('stroke-opacity', 0.55); labels.attr('opacity', 1); return; }
      const keep = id ? nbr.get(id) || new Set([id]) : new Set(nodes.filter(hit).map((n) => n.id));
      node.attr('opacity', (n) => keep.has(n.id) || hit(n) ? 1 : 0.15);
      labels.attr('opacity', (n) => keep.has(n.id) || hit(n) ? 1 : 0.15);
      link.attr('stroke-opacity', (e) => id ? (e.source.id === id || e.target.id === id ? 0.9 : 0.06) : (keep.has(e.source.id) && keep.has(e.target.id) ? 0.8 : 0.06));
    }
    NS.highlight = highlight; NS.labelSet = labelSet;
    svg.call(zoom.transform, fit);
    labelSet(); highlight(NS.sel); info(); legend(); rank();
    document.getElementById('net-names').replaceChildren(...net.nodes.map((n) => el('option', {value: label(n)})));
  }

  function legend() {
    const lg = document.getElementById('net-legend');
    if (PERSONISH()) {
      const items = Object.keys(ROLE_SLOT).map((k) => { const s = el('span', {text: T('personPrefix') + T(k)}); s.style.setProperty('--sw', slot(ROLE_SLOT[k])); return s; });
      if (NS.kind === 'person_topic') { const s = el('span', {text: T('typeTopic')}); s.style.setProperty('--sw', slot(3)); items.push(s); }
      const sz = el('span', {text: T('sizeNote')}); sz.style.setProperty('--sw', 'transparent');
      lg.replaceChildren(...items, sz);
    } else {
      const net = DATA.networks[NS.kind];
      const comms = [...commRank[NS.kind]].filter(([, i]) => i < 7);
      const items = comms.map(([c, i]) => {
        const members = net.nodes.filter((n) => n.comm === c).sort((a, b) => b.wdeg - a.wdeg);
        const s = el('span', {text: T('community', i + 1, label(members[0]), members.length)});
        s.style.setProperty('--sw', slot(i)); return s;
      });
      const rest = el('span', {text: T('otherComm')}); rest.style.setProperty('--sw', css('--muted-mark'));
      lg.replaceChildren(...items, rest);
    }
  }

  function info() {
    const box = document.getElementById('net-info');
    const n = DATA.networks[NS.kind].nodes.find((x) => x.id === NS.sel);
    if (!n) { box.replaceChildren(document.createTextNode(T('infoHint'))); return; }
    const byId = new Map(DATA.networks[NS.kind].nodes.map((x) => [x.id, x]));
    const nb = DATA.networks[NS.kind].edges.filter((e) => e.s === n.id || e.t === n.id).map((e) => ({id: e.s === n.id ? e.t : e.s, w: e.w})).sort((a, b) => b.w - a.w);
    box.replaceChildren(
      el('div', {}, el('b', {text: label(n)}), document.createTextNode(` · ${T('letters')}: ${n.letters.length} · ${T('degree')}: ${n.degree} · ${T('wdeg')}: ${n.wdeg} · ${T('btw')}: ${fmt3(n.btw)}` + (isPerson(n) ? ` · ${T('role')}: ${T(roleKey(n))} · ${T('ident')}: ${n.status || ''} · ${T('eid')}: ${n.eid || ''}` : ''))),
      el('div', {style: 'margin-top:6px'}, el('span', {class: 'k', text: T('lettersLbl')}), ...n.letters.map((no) => el('button', {class: 'pill', type: 'button', text: 'L' + String(no).padStart(3, '0'), title: byNo.get(no).addressee, onclick: () => openLetter(no, isPerson(n) ? n.id : '')}))),
      nb.length ? el('div', {style: 'margin-top:6px; color: var(--fg2)'}, document.createTextNode(T('neighbours') + nb.slice(0, 15).map((x) => `${label(byId.get(x.id))} (${x.w})`).join('; ') + (nb.length > 15 ? '…' : ''))) : el('div', {style: 'margin-top:6px; color: var(--fg2)', text: T('noNeighbours')})
    );
  }

  const RANK = {key: 'wdeg', dir: -1};
  function rank() {
    const t = document.getElementById('rank');
    const cols = [['label', T('colNode')]].concat(NS.kind === 'person_topic' ? [['type', T('colType')]] : [], [['letters', T('colLetters')], ['degree', T('colDegree')], ['wdeg', T('colWdeg')], ['btw', T('colBtw')], ['comm', T('colComm')]], PERSONISH() ? [['role', T('colRole')], ['status', T('colStatus')], ['eid', T('colEid')]] : []);
    const rows = DATA.networks[NS.kind].nodes.map((n) => ({...n, label: label(n), letters: n.letters.length, type: n.kind === 'topic' ? T('typeTopic') : T('typePerson'), role: isPerson(n) ? T(roleKey(n)) : '', status: n.status || '', eid: n.eid || '', comm: commRank[NS.kind].get(n.comm) + 1}));
    rows.sort((a, b) => { const x = a[RANK.key], y = b[RANK.key]; return (typeof x === 'string' ? x.localeCompare(y, LANG) : x - y) * RANK.dir; });
    t.tHead.replaceChildren(el('tr', {}, ...cols.map(([k, l]) => { const th = el('th', {text: l, scope: 'col', 'aria-sort': RANK.key === k ? (RANK.dir > 0 ? 'ascending' : 'descending') : 'none'}); th.addEventListener('click', () => { RANK.dir = RANK.key === k ? -RANK.dir : (typeof rows[0]?.[k] === 'string' ? 1 : -1); RANK.key = k; rank(); }); return th; })));
    t.tBodies[0].replaceChildren(...rows.map((r) => {
      const tr = el('tr', {tabindex: '0'}, ...cols.map(([k]) => el('td', {class: typeof r[k] === 'number' ? 'num' : '', text: k === 'btw' ? fmt3(r[k]) : String(r[k])})));
      const go = () => { NS.sel = r.id; NS.highlight?.(r.id); NS.labelSet?.(); info(); document.getElementById('netbox').scrollIntoView({behavior: 'smooth', block: 'center'}); };
      tr.addEventListener('click', go); tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      return tr;
    }));
  }

  document.getElementById('net-kind').addEventListener('change', (e) => { NS.kind = e.target.value; NS.sel = null; NS.q = ''; document.getElementById('net-q').value = ''; RANK.key = 'wdeg'; RANK.dir = -1; drawNet(); });
  document.getElementById('net-min').addEventListener('change', (e) => { NS.min = Number(e.target.value); drawNet(); });
  document.getElementById('net-iso').addEventListener('change', (e) => { NS.iso = e.target.checked; drawNet(); });
  document.getElementById('net-addr').addEventListener('change', (e) => { NS.addr = e.target.checked; drawNet(); });
  document.getElementById('net-q').addEventListener('input', (e) => {
    NS.q = e.target.value.trim();
    const exact = DATA.networks[NS.kind].nodes.find((n) => n.id === NS.q || label(n) === NS.q);
    if (exact) { NS.sel = exact.id; info(); }
    NS.highlight?.(NS.sel); NS.labelSet?.();
  });
  document.getElementById('z-in').addEventListener('click', () => NS.svg.transition().call(NS.zoom.scaleBy, 1.4));
  document.getElementById('z-out').addEventListener('click', () => NS.svg.transition().call(NS.zoom.scaleBy, 1 / 1.4));
  document.getElementById('z-reset').addEventListener('click', () => NS.svg.transition().call(NS.zoom.transform, NS.fit));

  // ---------- letters table ----------
  const TS = {q: '', series: '', topic: '', day: '', key: 'n', dir: 1, view: []};
  const selS = document.getElementById('tbl-series'), selT = document.getElementById('tbl-topic'), selD = document.getElementById('tbl-day'), inQ = document.getElementById('tbl-q');
  function fillSelects() {
    const keep = [selS.value, selT.value, selD.value];
    selS.replaceChildren(el('option', {value: '', text: T('all')}), ...SERIES.filter((s) => L.some((r) => r.series === s)).map((s) => el('option', {value: s, text: trSeries(s)})));
    selT.replaceChildren(el('option', {value: '', text: T('all')}), ...[...new Set(L.flatMap((r) => r.topics))].sort((a, b) => trTopic(a).localeCompare(trTopic(b), LANG)).map((t) => el('option', {value: t, text: trTopic(t)})));
    selD.replaceChildren(el('option', {value: '', text: T('all')}), ...[...new Set(L.map((r) => r.day))].sort((a, b) => a - b).map((d) => el('option', {value: String(d), text: T('dayLong', d)})));
    [selS.value, selT.value, selD.value] = keep;
  }
  const COLS = () => [['n', T('tNo')], ['day', T('tDay')], ['addressee', T('tAddr')], ['series', T('tSeries')], ['topics', T('tTopics')], ['intermediaries', T('tInterm')], ['summary', T('tSummary')], ['certainty', T('tCert')]];
  const cellText = (r, k) => k === 'series' ? trSeries(r.series) : k === 'topics' ? r.topics.map(trTopic).join('; ') : Array.isArray(r[k]) ? r[k].join('; ') : String(r[k] ?? '');
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  L.forEach((r) => { r._hay = norm([r.addressee, r.addressee_src, r.heading, r.series, SERIES_EN[r.series] || '', r.summary, r.persons.join(' '), r.places.join(' '), r.institutions.join(' '), r.topics.join(' '), r.topics.map((t) => DATA.topic_en[t] || '').join(' '), r.text, 'L' + String(r.n).padStart(3, '0')].join(' ')); });

  function drawTable() {
    const q = norm(TS.q.trim());
    TS.view = L.filter((r) => (!q || r._hay.includes(q)) && (!TS.series || r.series === TS.series) && (!TS.topic || r.topics.includes(TS.topic)) && (!TS.day || String(r.day) === TS.day));
    TS.view.sort((a, b) => { const x = a[TS.key], y = b[TS.key]; const c = typeof x === 'number' ? x - y : cellText(a, TS.key).localeCompare(cellText(b, TS.key), LANG); return c * TS.dir || a.n - b.n; });
    const t = document.getElementById('tbl');
    t.tHead.replaceChildren(el('tr', {}, ...COLS().map(([k, l]) => { const th = el('th', {text: l, scope: 'col', 'aria-sort': TS.key === k ? (TS.dir > 0 ? 'ascending' : 'descending') : 'none'}); th.addEventListener('click', () => { TS.dir = TS.key === k ? -TS.dir : 1; TS.key = k; drawTable(); }); return th; })));
    t.tBodies[0].replaceChildren(...TS.view.map((r) => {
      const tr = el('tr', {tabindex: '0'}, ...COLS().map(([k]) => {
        if (k === 'certainty') return el('td', {}, el('span', {class: 'cert', text: r.certainty}));
        return el('td', {class: k === 'n' || k === 'day' ? 'num' : '', text: cellText(r, k)});
      }));
      const go = () => openLetter(r.n, TS.q.trim());
      tr.addEventListener('click', go); tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      return tr;
    }));
    document.getElementById('tbl-cnt').textContent = T('shown', TS.view.length, L.length);
  }
  function filterLetters(f) {
    TS.q = f.q || ''; TS.series = f.series || ''; TS.topic = f.topic || ''; TS.day = f.day || '';
    inQ.value = TS.q; selS.value = TS.series; selT.value = TS.topic; selD.value = TS.day;
    showTab('letters'); drawTable();
  }
  inQ.addEventListener('input', () => { TS.q = inQ.value; drawTable(); });
  selS.addEventListener('change', () => { TS.series = selS.value; drawTable(); });
  selT.addEventListener('change', () => { TS.topic = selT.value; drawTable(); });
  selD.addEventListener('change', () => { TS.day = selD.value; drawTable(); });
  document.getElementById('tbl-clear').addEventListener('click', () => filterLetters({}));
  document.getElementById('tbl-csv').addEventListener('click', () => {
    const cols = ['n', 'pages', 'day', 'addressee', 'addressee_status', 'addressee_src', 'language', 'series', 'heading', 'persons', 'intermediaries', 'places', 'institutions', 'topics', 'summary', 'certainty', 'uncertain', 'hand_change', 'notes'];
    const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [cols.join(',')].concat(TS.view.map((r) => cols.map((k) => esc(cellText(r, k))).join(',')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
    const a = el('a', {href: URL.createObjectURL(blob), download: LANG === 'en' ? 'rybenko_pilot_letters.csv' : 'rybenko_pilot_listy.csv'});
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // ---------- letter dialog ----------
  const dlg = document.getElementById('dlg');
  let cur = null, curMark = '';
  function markText(pre, text, term) {
    pre.replaceChildren();
    const t = (term || '').split(',')[0].trim();
    if (!t || t.length < 3) { pre.textContent = text; return; }
    const base = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
    const hayChars = [...text].map((c) => base(c) || c);
    const hay = hayChars.join('');
    const first = base(t.split(/[\s-]/)[0]);
    const needle = first.slice(0, Math.max(4, Math.min(8, first.length - 2)));
    if (!needle) { pre.textContent = text; return; }
    const offs = []; let acc = 0; hayChars.forEach((c) => { offs.push(acc); acc += c.length; });
    const chars = [...text];
    let i = 0, last = 0; const out = [];
    while ((i = hay.indexOf(needle, i)) >= 0) {
      const s = offs.findIndex((o) => o >= i); const e = offs.findIndex((o) => o >= i + needle.length);
      const si = s < 0 ? chars.length : s, ei = e < 0 ? chars.length : e;
      out.push(document.createTextNode(chars.slice(last, si).join('')), el('mark', {text: chars.slice(si, ei).join('')}));
      last = ei; i += needle.length;
    }
    out.push(document.createTextNode(chars.slice(last).join('')));
    pre.replaceChildren(...out);
  }
  function openLetter(no, mark) {
    const r = byNo.get(no); if (!r) return;
    cur = no; curMark = mark || '';
    document.getElementById('dlg-title').textContent = `L${String(no).padStart(3, '0')} – ${r.addressee}`;
    document.getElementById('dlg-sub').textContent = T('dlgSub', r);
    const meta = document.getElementById('dlg-meta');
    const rows = [
      ['mHeading', r.heading], ['mAddrSrc', r.addressee_src], ['mAddrStatus', r.addressee_status], ['mSummary', r.summary],
      ['mPersons', r.persons], ['mInterm', r.intermediaries], ['mPlaces', r.places], ['mInst', r.institutions], ['mTopics', r.topics.map(trTopic)],
      ['mCert', r.certainty], ['mUnc', String(r.uncertain)], ['mHand', r.hand_change ? T('yes') : ''], ['mNotes', r.notes],
    ];
    meta.replaceChildren(...rows.flatMap(([k, v]) => {
      const val = Array.isArray(v) ? v : (v ? [v] : []);
      if (!val.length) return [];
      const dd = el('dd');
      if (['mPersons', 'mPlaces', 'mInst', 'mInterm'].includes(k)) {
        const kind = k === 'mPlaces' ? 'places' : k === 'mInst' ? 'institutions' : 'persons';
        v.forEach((x) => {
          const inNet = DATA.networks[kind].nodes.some((n) => n.id === x);
          dd.append(inNet ? el('button', {class: 'pill', type: 'button', text: x, title: T('showInNet'), onclick: () => { dlg.close(); goNode(kind, x); }}) : el('span', {class: 'pill', style: 'cursor:default', text: x, title: T('outOfNet')}));
        });
      } else dd.textContent = val.join('; ');
      return [el('dt', {text: T(k)}), dd];
    }));
    markText(document.getElementById('dlg-tx'), r.text, curMark);
    document.getElementById('dlg-prev').disabled = !byNo.has(no - 1);
    document.getElementById('dlg-next').disabled = !byNo.has(no + 1);
    if (!dlg.open) dlg.showModal();
  }
  function goNode(kind, id) {
    NS.kind = kind; NS.sel = id; NS.q = ''; NS.min = 1;
    document.getElementById('net-kind').value = kind; document.getElementById('net-min').value = '1'; document.getElementById('net-q').value = '';
    showTab('network');
  }
  document.getElementById('dlg-close').addEventListener('click', () => dlg.close());
  document.getElementById('dlg-prev').addEventListener('click', () => openLetter(cur - 1, curMark));
  document.getElementById('dlg-next').addEventListener('click', () => openLetter(cur + 1, curMark));
  dlg.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' && byNo.has(cur - 1)) openLetter(cur - 1, curMark); if (e.key === 'ArrowRight' && byNo.has(cur + 1)) openLetter(cur + 1, curMark); });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

  // ---------- boot ----------
  function redrawAll() {
    const active = tabs.find((b) => b.getAttribute('aria-selected') === 'true').dataset.tab;
    if (active === 'overview') drawOverview(); else drawKpis();
    if (active === 'network') drawNet();
  }
  document.getElementById('lang').addEventListener('click', () => {
    LANG = LANG === 'pl' ? 'en' : 'pl';
    try { localStorage.setItem('rybenko-lang', LANG); } catch (e) { /* storage unavailable */ }
    applyStatic(); fillSelects(); drawTable(); redrawAll();
    if (dlg.open && cur) openLetter(cur, curMark);
  });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redrawAll, 200); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
  applyStatic(); fillSelects(); drawOverview(); drawTable();
})();
</script>
</body>
</html>
