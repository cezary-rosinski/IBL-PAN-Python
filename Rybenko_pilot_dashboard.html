ski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka: prośba o poparcie zamiarów Rybeńki przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do JMP. Chaleckiego Stolnikowicza\nd 9 Janu[arii] 1750 z Nieswiża\nCokolwiek miałem voti et desiderij\nmei, opowie to wszystko ad longum ktory-\nkolwiek z JMciow Panow Łopot St[aros]ta\nBobruyski, lub Wiszczyński Bunczuczny\nmoy WMWPanow y dostatecznieyszego kto-\nregokolwiek z nich spuszczaiąc się interessu\nexplikacyi uniżenie upraszam WMPana aże-\nbyś in praemissis łaski swoiey denegare nieraczył\nktorą omni possibilitate zasłużyć spondendo\nwyznawam żem iest statecznym sercem\ny umysłem etc."},{"n":68,"pages":"26","day":9,"language":"pol","addressee":"Faszcz, sędzia rzeczycki","addressee_src":"Faszcz, sędzia rzeczycki","addressee_status":"as in heading (no AM correction)","heading":"Do JMP. Faszcza Sędziego Grodz[kiego] Rzeczyc[kiego] d. 9. Janu[arii] z Nieswiża 1750","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka: prośba o poparcie zamiarów Rybeńki przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do JMP. Faszcza Sędziego Grodz[kiego] Rzeczyc[kiego]\nd. 9. Janu[arii] z Nieswiża 1750\nJm bardziey stateczney WMcPana ku\nmnie innixus iestem przyiaźni, tym się pe-\nwniey upewniam, że remonstrowane pleniori\nore JMP. Łopotta St[aros]ty Bobruyskiego lub JM-\nPana Wiszczyńskiego Bunczucznego mego\nniektore vota et intentiones meas nie tylko\nw łaskawym u siebie WMPan locabis sercu\nale dowodną y skuteczną manutencyą\nswoią one wesprzesz, iako superaddo tu iako\nnayuniżeńszą oto prozbę moią do WMPana tak\nile uznam dowodow łaskawey w tym uczynności\nJego wszystko to perenni zasłużyć conabor\nstudio piszący się ad quosvis usus."},{"n":69,"pages":"26-27","day":9,"language":"pol","addressee":"Giżycki, mostowniczy rzeczycki","addressee_src":"Giżycki, mostowniczy rzeczycki","addressee_status":"as in heading (no AM correction)","heading":"Do JMcPana Giżyckiego Mostowniczego Rzeczyckiego d 9. Janu[arii] 1750 z Nieswiża","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka: prośba o poparcie zamiarów Rybeńki przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do JMcPana Giżyckiego Mostowniczego Rze-\nczyckiego d 9. Janu[arii] 1750 z Nieswiża\nPolecaiąc ustney negotia quaeq[ue] WMPa-\nna Łopotta St[aros]ty Bobruyskiego MWMPana re-\nmonstracyi y WMPana Wiszczyńskiego Bun-\nczucznego mego, superaddo uniżone prozby\n[kustosz: moie]\nmoie abyś WMcPan (ktorykolwiek cum ex-\npositione votorum meorum do niego recurret)\nraczył omnem wyświadczyć facilitatem\ni Ja upewniam że za wszelką uczynność\nWMcPana wszelkie na zasłużenie dispo-\nsam sposobności zostaiąc w prawdziwych\nwyznaniach etc."},{"n":70,"pages":"27","day":9,"language":"pol","addressee":"Kielczewski, stolnik rzeczycki","addressee_src":"Kielczewski, stolnik rzeczycki","addressee_status":"as in heading (no AM correction)","heading":"Do JmcPana Kiełczewskiego Stolnika Rzeczyckiego d 9. Janu[arii] 1750 Anno","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka: prośba o poparcie zamiarów Rybeńki przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":1,"hand_change":false,"notes":"","text":"Do JmcPana Kiełczewskiego Stolnika\nRzeczyckiego d 9. Janu[arii] 1750 Anno\nJako sobie non vana omina pro praw-\ndziwych WMcPana ku mnie sentymentach\ntak w zupełney ufności niepomieszania [?] onych\ncommisi niektore prozby moie ustney\nrelacyi W JMcPana Łopotta St[aros]ty Bobruysk[iego]\nWMcPana y JMcP. Wiszczyńskiego Bunczu-\ncznego mego, superaddendo, że cokolwiek\nWMcPan ktoremukolwiek do siebie\nudaiącemu się poleconych odemnie interessow\nswoiey oświadczysz uczynności, wszystko\nto będzie in cumulo moich nieustannych\nJemu obowiązkow w ktorych permanebo\ntenerrimo voto etc."},{"n":71,"pages":"27-28","day":9,"language":"pol","addressee":"Pruszanowski, wojski i pisarz grodzki rzeczycki","addressee_src":"Pruszanowski, wojski i pisarz grodzki rzeczycki","addressee_status":"as in heading (no AM correction)","heading":"Do W JMcP. Pruszanowskiego Woyskiego y Pisarza Grodz[kiego] Rzeczyck[iego] d 9 Janu[arii] 1750","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka: prośba o poparcie zamiarów Rybeńki przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do W JMcP. Pruszanowskiego Woyskiego\ny Pisarza Grodz[kiego] Rzeczyck[iego] d 9 Janu[arii] 1750\nZ tych instynktow że się nieodmiennie\nnigdy łaskawy WMcPana ku mnie glorior\nprzyiaźni, wnoszę iak nayuniżeńsze prozby\nmoie, ażebyś wynurzone sobie pleniori re-\nmonstratione, lub to W JMPana Łopota St[aros]ty Bo-\nbruyskiego, czyli JMP. Wiszczyńskiego Bunczucz[nego]\nmego vota et intentiones meas osobliwszą łaską\n[kustosz: y protekcyą]\ny protekcyą swoią iuvare raczył. Obowiążesz\nmnie to upewniam strictiori nexu łaska-\nwey WMcPana promereri uczynności propriis\nusibus iako piszącego się ad omnes usus."},{"n":72,"pages":"28","day":9,"language":"pol","addressee":"Pruszanowski, podczaszy rzeczycki","addressee_src":"Pruszanowski, podczaszy rzeczycki","addressee_status":"as in heading (no AM correction)","heading":"Do JMcPana Pruszanowskiego Podczasz[ego] Rzeczyckiego d 9. Janu[arii] 1750 z Nieswiża","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka: prośba o poparcie zamiarów Rybeńki przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do JMcPana Pruszanowskiego Podczasz[ego]\nRzeczyckiego d 9. Janu[arii] 1750 z Nieswiża\nUtwierdza mnie gruntownie w nadziei trwa-\niąca y nieporuszona dla mnie łaska WMPa-\nna, że cokolwiek votorum meorum mieć bę-\ndziesz sobie doniesionego lub to z remonstra-\ncyi W JMPana Łopota St[aros]ty Bobruyskiego\nlub JMcPana Wiszczyńskiego Bunczuczn[ego]\nmego wszystko to amico prosequendo corde\nsuffragarius et tutelaris mnie będziesz tak\nkiedy oto nayuniżeńsze moie wyrażam pro-\nzby wraz spondeo o nieskończonych moich\nad promerendum łaski Jego obligacyach pi-\nszę się propensione interminabili etc"},{"n":73,"pages":"28-36","day":9,"language":"pol","addressee":"instancjalne listy do powiatu rzeczyckiego","addressee_src":"instancjalne listy do powiatu rzeczyckiego","addressee_status":"as in heading (no AM correction)","heading":"Instancialne Listy do P[owia]tu Rzeczyckiego.","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":["Sejmik gromniczny (deputacki)"],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Listy „instancjalne” do powiatu rzeczyckiego: kilkanaście wariantów formularza bez adresata (s. 28–36). Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":4,"hand_change":false,"notes":"Kilkanaście wariantów formularza bez adresata (s. 28–36).","text":"Instancialne Listy do P[owia]tu Rzeczyckiego.\nUstnie et plenius WMWMPanu exponet ktorykolwiek\nz Jchmciow Panow Łopotta St[aros]ty Bobruyskiego y Jm Pana Wisz-\nczyńskiego Bunczucznego mego MWMPanow vota et deside-\nria mea. Ja tylko adiungo uniżoną prozbę moią, abyś mię\nWMPan nieodmowioną raczył prosequi łaskawością, będąc\npewny, że w nieustaiących za to permanebo obowiązkach\nad quosvis usus. &c.\n\nJako są interpretes votorum meorum Jchmć Panowie\nŁopott Starosta Bobruyski, Wiszczyński Bunczuczny\nmoy, na ktorych się referuię, ktorykolwiek z nich enu-\ncleabit sufficientissime prozby moie WMWMPanu ażebyś\npro firma sua ku mnie tenerritudine skuteczną łaską swo-\nią wesprzeć one raczył, tak cokolwiek uznam łaskawey u-\nczynności Jego, wszystko to ad cumulum nieustaiących moich\ndo zasłużenia temu przyłączę obowiązkow, piszę się\nvoto interminabili &c:\n\nOświadczone wielo dowodami łaskawe WMWMPana\nku mnie serce, czyni mię spei non ambiguum, że cokolwiek\nvoti et intentionis meae mieć będziesz WMWMPan sobie do-\nniesionego przez WJmP. Łopotta St[aros]ty Bobruyskiego, czyli\nprzez Jm P. Wiszczyńskiego, ktorych to sufficientiori remon-\nstratione poleciłem, we wszystkim tym summo auxilio pro-\ndesse zechcesz, iako wnoszę enixas oto preces meas, tak\nin sponsione prawdziwych moich do zasłużenia praestiti\nJego obowiązkow, zostawam firma tenerritudine &c:\n\nUfam w łaskawym WMWMPana nieodmiennie nigdy ser-\ncu, że polecone vota et intentiones meas ustney remon-\nstracyi WW Jchmć Panow Łopotta St[aros]ty Bobruyskiego Wisz-\nczyńskiego Bunczucznego, ktorykolwiek z nich odkryie\ny opowie sufficienter WMWMPanu, auxilio łaski swoiey\nfirmiter one manutenere zechcesz, tak nayuniżeńszą o to\nmoią wnosząc prozbę zostawać sam będę w nieustaią-\ncych do zasłużenia tanti facti obowiązkach iako pisza-\ncy się ad omnes nutus. &c.\n\nCokolwiek mam in votis opowie to wszystko ktorykolwiek\nustnie z Jchmć Panow Łopotta St[aros]ta Bobruyski Jm Pan\nWiszczyński Bunczuczny moy, na ktorych totaliter desi-\n[kustosz: deriorum]\nderiorum meorum referuiąc się remonstracyą enixissime pro-\nszę WMWMPana, ażebyś takowe intencye moie uczynnością\ny łaską swoią suffragari raczył. a za tey łaski WMWMPa-\nna w każdym skinieniu, iako non immemor będę, tak circa\nrepetitas prozby moiey vices profiteor żem iest alacri ad\nvota corde &c:\nCzyni mię bezpłonney nadziei dobre ku mnie WMWM-\nPana serce, że w prozbach odemnie zaniesionych, tak przez\nJm Pana St[aros]tę Bobruyskiego, lub Jm P Wiszczyńskiego Bun-\nczucznego mego satisfacere zechcesz, y mi dopomożesz\nwe wszystkim, na dokument swoiey ku temu przychil-\nności, ktory iest pro semper &c.\n\nTylo dowodami łaski WMWMPana compulsus będąc nie\ninaczey, ominor iak y teraźnieyszey prozbie moiey, ktorą\nieden ktory z Jchmć Panow Łopott St[aros]ta Bobruyski, lub\nWiszczyński Bunczuczny moy MWMPanow przełoży ore-\ntenus, votivum successum takowy affekt y łaska\nWMWMPana pociągnie mię do nieustaiących obliga-\ncyi w ktorych iestem constanti corde &c:\n\nZnaiąc propitium WMWMPana votis meis, hac in\nfiducia interess moy interpreti labio ktoregokolwiek\nz Jchmć Panow Łopotta St[aros]ty Bobruyskiego, lub Wiszczyń-\nskiego Bunczucznego mego MWMPanow poleciłem\nexplikacyi, uniżenie upraszaiąc WMWMPana, ażebyś\nforti manutentione sua prodesse raczył, oświadczoną\nWMWMPana hoc in puncto łaskę własnemi nie o-\nmieszkam zasłużyć obowiązkami, w ktorych iestem\npromptissimo ad usus studio &c:\n\nDobre to ku mnie WMWMPana sprawi serce,\nkiedy ad postulationem WJm Pana St[aros]ty Bobruyskie-\ngo, lub Wiszczyńskiego Bunczucznego mego we\nwszystkim łatwym się stawisz, y ich w interessie moim\nprawiących iuvare zechcesz, ktorą uczynność iako\nwszelką Jemu odsłużę zawsze przychylnością tak zo-\nstaię ubique ad omnia promptus. &c:\n\nDoświadczona w prozbach moich uczynność\nWMWMPana poufałym czyni mię zawsze, że y\nw teraźnieyszych przez JmcPana St[aros]tę Bobruyskie-\ngo lub Wiszczyńskiego Bunczucznego mego za-\nniesionych konwieniencyach moich faultorem [?] se\npromptum ostendes, o co powtorne prozby mo-\niey geminando vices zostaię immutabilis etc\n\nNieustanne dowody łaskawey WMWMPana ku\nmnie przyiaźni attollunt mię w nadziei, że te\nwszystkie intencye moie na ustną JPP. Łopota\nStarosty Bobruyskiego, Wiszczyńskiego Bunczucz-\nnego mego polecone remonstracyą, ktorykolwiek\nz nich opowie y doniesie WMWMPanu skuteczną\nłaską y kooperacyą Jego zaszczycone będą, tak wyrażaiąc\noto iak nayuniżeńsze prozby moie circa sponsio-\nnes prawdziwych moich ad promerendum obligacyi\nzostawam continuo voto etc\n\nNiepłonna moia nadzieia daie omen o punktual-\nney Jego zawsze doznaney ku mnie addykcyi, że y teraz\nw [?] moim przez JmPana Starostę Bobruyskiego, lub Wisz-\nczyńskiego Bunczucznego mego, WMWMPanu przełożo-\nnym interessie tymże Jchmciom dopomożesz, o mnie\npewien będąc że za te dla mnie uczynność gotowym\ndo zawdzięczenia zostaię etc\n\nDoznaney nieraz WMWMPana fidendo przyiaźni nie-\npłonney iestem nadziei że y w teraźnieyszey prozbie mo-\niey ktorą ad coram ktorykolwiek z JPP. Łopott Starosta\nBobruyski lub Wiszczyński Bunczuczny moy MWMPanow\nexponet, voto suo prodesse raczysz, o co iteratas prozby mo-\niey geminando vices ochoczym wpełnić skinienia Jego\nexequi niezaniedbam sercem, iako będący cunctorum\nvotorum etc\n\nDoniesie fusius WMWMPanu ktorykolwiek z JPP. Ło-\npota St[aros]ty Bobruyskiego y JmPana Wiszczyńskiego Bun-\nczucznego mego MWMPanow desideria mea ktore abyś\nWMPan raczył łaskawie acceptare, et sua dare iuvami-\nna, iako usilnie oto proszę tak despondendo do zasłuże-\nnia wyświadczoney łatwości cunctas possibilitates meas\niestem firma voto\n\nIw przeszłych czasach, y w teraźnieyszych iako zawsze\nWMWMPana doznawałem ku mnie serca przychylno-\nści, tak niewątpię y teraz o niey pokorną intencyi mo-\niey wnoszę prozbę, abyś iakokolwiek od JchmćPP Staro-\nsty Bobruyskiego lub Wiszczyńskiego Bunczucznego mego\nusłyszysz ex postulatorem [?], w niey się gotowym stawił,\nuczynisz to ex sui ku mnie tenerritudine cordis, y\ndo wszelkich obowiążesz zasług tą uczynnością tego kto-\nry iest pro semper etc\n\nŁaskawym WMWMPanu ubique locorum gloriando\nsercem, w tey ufności niosę pokorne prozby moie aże-\nbyś pro sua ku mnie tenerritudine polecony ustney\nktoregokolwiek z Jchmć Panow Łoppotta Starosty Bo-\nbruyskiego, lub Wiszczyńskiego Bunczucznego mego\nMWMPanow interess remonstracyi probata dexteri-\ntate sua wesprzeć raczył, co iako infinito pro-\nmereri spondeo studio, tak w tey obligacyi znam\nsię być quo non sincerior alter etc\nDowodney WMWMPana innixus przychylności poruczy-\nłem ustnym expressyom WJmPa Łoppota St[aros]ty Bobruyskie-\ngo MWMPana y JPana Wiszczyńskiego Bunczucznego me-\ngo niektore prozby moie, ktorykolwiek tedy exponet one\nWMWMPanu aby swoy wzięły skutek przez łatwą WM-\nWMPana uczynność enixissime oto upraszaiąc w niepo-\nruszonych ad usus zostaię obowiązkach etc\n\nNad obszernieyszą negotij remonstracyą per os fidele W-\nJPana Łoppota St[aros]ty Bobruyskiego MWMPana y JPana\nWiszczyńskiego Bunczucz[nego] mego totaliter referuiąc się in\nplena iestem fiducia, że ktorykolwiek z Jchmciow uda-\nsię in propositis meis do WMWMPana, omnem uzna\nfelicitatem, ktorą nieskończonemi conabor sam zasłu-\ngiwać sposobnościami będąc ad quaeq[ue] vota etc\n\nWiele razy doznane WMWMPana przychylności, czyni\nmię fidum, że y teraz proszony ode mnie JP Starosta Bo-\nbruyski lub Wiszczyński Bunczuczny moy w intencyi\nmoiey otrzymaią skutek, za ktore mi enixas prozby moiey\nzanoszę vices ad quosvis usus zostaię corde et voto etc\n\nJaśniey WMWMPana ktorykolwiek z JPP Łoppotta St[aros]ty\nBobruyskiego, y JP Wiszczyńskiego Bunczucznego mego\nMWMPanow w poleconych ode mnie nonnullis negotijs\nexposcet uczynności, abyś mi WMWMPan także pro tene-\nritudine sua firma praestare raczył, iako o to enixe pro-\nszę, tak zdaiąc się na obszernieyszą oretenus expressyą in\nproprijs do zasłużenia studijs zostaię ad omnia vota\n\nW nadziei dobrego ku mnie WMWMPana serca, zanoszę\nuniżoną prozbę, abyś cokolwiek z Jchmć Panow St[aros]ty Bobruy-\nskiego, lub Wiszczyńskiego Bunczucznego mego wprowadzi [?]\nna to wszystko zezwolił, y suo consilio et auxilio prodesse\nraczył, o co powtorne prozby moiey geminando vices, do za-\nsłużenia w każdych skinieniach gotowym zostaię etc"},{"n":74,"pages":"30","day":9,"language":"pol","addressee":"Ułunkowski, podstoli i podstarości rzeczycki","addressee_src":"Ułunkowski, podstoli i podstarości rzeczycki","addressee_status":"as in heading (no AM correction)","heading":"Do WJmciPana Ułunkowskiego Podstolego y Podstarościego Rzeczyckiego d 9 Januarij z Nieswiża","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["powiat rzeczycki"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Seria rzeczycka (cd.): prośba o poparcie zamiarów przedstawionych ustnie przez Łopotta lub Wiszczyńskiego. Kontekst (L055, L081–083, nie z tego listu): kampania przed sejmikiem deputackim w Rzeczycy.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do WJmciPana Ułunkowskiego Podstolego y Podsta-\nrościego Rzeczyckiego d 9 Januarij z Nieswiża\nPewien optimarum WMWMPana ku mnie dispositionum,\nwątpić nie mogę, że w niektorych intencyach moich ple-\nniori labio Jchmć Panow Łopotta St[aros]ty Bobruyskiego\nWiszczyńskiego Bunczucznego mego poleconych, a WMW-\nMPanu przez ktoregokolwiek z nich sufficienter doniesio-\nnych, znaydę singularem Jego manutentionem et quam\nefficacissima auxilia, gdy iako nayuniżeńsze oto moie\ndo WMWMPana wnoszę prozby, tak spondendo z siebie\nnieskończone moie do zasłużenia uznaney w tym ła-\nski Jego obligacye, zostawam interminabili voto &c"},{"n":75,"pages":"30","day":9,"language":"pol","addressee":"Ułunkowski, cześnik rzeczycki","addressee_src":"Ułunkowski, cześnik rzeczycki","addressee_status":"as in hac expectatione tenerrimo corde."},{"n":82,"pages":"38-39","day":9,"language":"pol","addressee":"Łopott-Bykowski Józef, starosta bobrujski","addressee_src":"Łopott, starosta bobrujski","addressee_status":"identified (AM)","heading":"do JmPana Łopota Starosty Bobruyskiego sub eadem data","series":"Plan deputacki (9 I)","persons":["Chalecki Antoni, podkomorzy rzeczycki","Radziwiłł Stanisław","Radziwiłł Albrycht, starosta rzeczycki","Rokicki Franciszek, wojski oszmiański [?]","Radziwiłł Karol Stanisław \"Panie Kochanku\"","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["Wilno","Rzeczyca"],"institutions":["Trybunał Główny WXL","Sejmik gromniczny (deputacki)"],"topics":["Kariera synów i krewnych","Trybunał Główny Litewski","Sejmiki (gromniczne, deputackie)","Tajność i plany ukryte","Odesłanie do ustnej relacji posłańca"],"summary":"Instrukcja dla Łopotta: plan odkryty przez przeciwników, syn do Wilna; zjednać Chaleckiego dla kandydatury starosty rzeczyckiego.","certainty":"medium","uncertain":9,"hand_change":false,"notes":"","text":"do JmPana Łopota Starosty Bo-\nbruyskiego sub eadem data\nMaiąc de certa notitia że iuż iest odkryte\nadversis ułożenie nasze in ordine promo-\nwowania Książęcia Jmci Stanisława z Wilna\nnie inaczey sądząc że mu tam do tey funkcyi\nprzeszkadzać będą, umyśliłem nie do Rzeczycy\nlecz tam do Wilna ordynować Syna mego\ndrugiego, dla utrzymania się in hoc chara-\nctere więc że się odmieniła pierwsza planta\nusilnie convenio WMWMPana abyś chciał\nwyperswadować usilnie Książęcia Jmci Sta-\nrostę Rzeczyckiego ad ambiendam hanc functio-\nnem Deputacyi z Rzeczycy dla wiadomych ra-\ncyi [?] okoliczności, sam usilnego dokładał\nstarania omnem movendo lapidem do utrzy-\nmania Książęcia Jmci choćby z JmP. Rokickim\ndla łatwieyszych skutkow in praemissis aże\nJmP Podkomorzy Chalecki może być iniurius\nKsiążęciu Jmci więc dla tych cyrkumstancyi\nniech się iustrzyma [?] Książę Jmć z otwarciem\nhic et nunc interessu swego a WMP. captando\ndobre serce dla Książęcia Jmci upewnisz ode-\nmnie JmP. Podkomorzego że do pokonania powa-\nżnieyszych [?] wszelkiey dołożę usilności circa inchoa-\ntionem Trybunału w Wilnie, aby tylko teraz\nin illo intersticio czasu niebyło żadnych [?] a osobliwie\nad hanc aspirationem nie był Książęciu Jmci\nszkodliwym, przez co da mi motiva adiunc-\nta do zasłużenia sobie takowey uczynno-\nści studia, spuszczaiąc się w tym na usilne WM-\nWMPana staranie proszę y wszelkiemi obo-\nwiązkami obstringendo abyś chciał w tym po-\nkazać activitatem suam przez utrzymanie\nKsiążęcia Jmci przy Deputacyi gdyż w tym\nvertitur interess publiczny y honor Domu mego\na Ja to zasłużę WMPanu omni conatu et stu-\ndio posyłam też in socium laboris JmP. Bun-\nczucznego mego y instrukcyą dla niego daną\nzapieczętowaną przyłączam ktorą mu oddasz WM-\nPan et iunctis conatibus ad succedendum za Ks.\nKsiążęcia Jmci Starosty mocnego dołożysz\nstarania y nayskutecznieyszych sposobow\naże tę instrukcyą przesyłaiąc [?] do WMPana\nczynię to dla tego aby się wszystko zachowało\nwe wszystkim [?] y przez […] prędkie [?] niecze-\npiąto [?] tey powtorney planty, ieżeli tedy\nflexibilis będzie do tego Książę Jmć Starosta\nco y sam w liście moim ardentissime pro-\nszę y iako WMPan będziesz expiscować [?]\nskutki chciey mi citissime znać dawać\ny doskonale informować ieżeli czego po-\ntrzeba będzie ad prosperiores eventus tych\nżądz y intencyi moich. Expedycyą moią\ntakże przyłączoną oddasz WMPan JmP Pod-\nkomorzemu w ktorey iako także kontenta\niż się ofiaruię mu służyć na początku\nTrybunału do pokombinowania zachodzą-\ncych differencyi ad interim proszę aby się in\nhoc intersticio znosił we wszystkim z\nKsiążęciem Jmcią, osobliwie in occurrentia\npublica następuiącego Seymiku, co tak\nprolixe wyraziwszy et manutentioni\nWMWMPana pomienione negotiam\npoleciwszy parando sam do zawdzięczenia\nwzaiemne obowiązki zostawam plena tene-\nritudine."},{"n":83,"pages":"39-41","day":9,"language":"pol","addressee":"Chalecki Antoni, podkomorzy rzeczycki","addressee_src":"Chalecki, podkomorzy rzeczycki","addressee_status":"identified (AM)","heading":"Do JmP Chaleckiego Pod[ko]morzego Rzeczyckiego sub eadem data.","series":"Plan deputacki (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Radziwiłł Albrycht, starosta rzeczycki","Radziwiłłowa Anna Kunegunda z Chaleckich, starościna rzeczycka","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["Rzeczyca","Wilno","powiat rzeczycki"],"institutions":["Trybunał Główny WXL","Sejmik gromniczny (deputacki)"],"topics":["Kariera synów i krewnych","Trybunał Główny Litewski","Sejmiki (gromniczne, deputackie)","Tajność i plany ukryte","Spory sądowe i arbitraż","Odesłanie do ustnej relacji posłańca"],"summary":"List do Chaleckiego i tajna instrukcja dla Wiszczyńskiego: mediacja sporu, poczta sztafetowa, dystrybucja listów, zapieczętowane punkty.","certainty":"medium","uncertain":7,"hand_change":false,"notes":"List do Chaleckiego oraz instrukcja dla Wiszczyńskiego (s. 40–41) pod tą samą datą.","text":"Do JmP Chaleckiego Pod[ko]-\nmorzego Rzeczyckiego\nsub eadem data.\nPragnąc dać dowod prawdziwych żądz moich\naby inter cognatas acies zobopolna konfi-\ndencya et mutuus mogł stabiliri amor\nofiaruiąc chętnie usługę moią do umoli-\nfikowania [?] per media pacis interessu WMPana\nz Książęciem Jmcią Starostą Rzeczyckim\nBratem moim circa reassumptionem\nTrybunału w Wilnie tey [?] dopiero dopraszam\nsię WMWMPana uczynności abyś in illo\nintersticio czasu przychylne dla Książęcia\nJmci oświadczał serce, y chciał z nim ad prospe-\nrum eventum Seymiku następuiącego suos iun-\ngere conatus, o co oretenus doprasza się także\nbędą JmPan Wiszczyński Bunczuczny moy y Jm-\nPan Łopot Starosta Bobruyski pokażesz y przez\nto WMPan aequanimitatem suam y Jey [?]\nktorą masz z nami przez Księżnę Jmć Starościnę [?]\nRzeczycką korrelacyi zobaczysz [?] meos\namicos maiąc mnie zawsze ad quaeq[ue] offi-\ncia.\n[instrukcja]\nSub eadem data Instrukcya pro\nmemoria dana JmP. Wiszczyń-\nskiemu Bunczucznemu.\n1mo Jak odbierze te pro memoria daną\nsobie instrukcyą JmPan Bunczuczny no o tym\nwiedzieć doskonale y upewnić że Syn moy\nniepoiedzie do Rzeczycy na Seymik Deputac-\nki dla tego może starać wszelką usilno-\nścią wspolnie z JmP. Starostą Bobruyskim aże-\nby z Powiatu Rzeczyckiego mogł się utrzymać\nprzy funkcyi Deputackiey Książę Jmć Starosta\nRzeczycki choćby z JmPanem Rokickim\n[na marginesie: N.B.] 2do aże może być dla Książęcia Jmci Sta-\nrosty Rzeczyckiego przeciwnym JmP. Chalec-\nki Podkomorzy, upewnić onego odemnie\nJmP. Starosta Bobruyski y JmPan Bunczu-\nczny że całym sercem starać się będę amica-\nbiliter tę sprawę pogodzić ad interim niech\nmi wyświadczy tę łaskę y [nad wierszem: pokaże dowod] affektu\nswego spokrewnionego z nami, w promowowa-\nniu Książęcia Jmci do tey funkcyi, ile kiedy ma-\niąc fasces Trybunału Książę Jmć Starosta nie\nmoże mieć swoiey sprawy et ad strepitum\niuris z nim przychodzić, upewnić oraz że\ntakową łatwość omni possibilitate odsłu-\ngiwać nieomieszkam pozyskaiąc to za wy-\nświadczoną dla mnie samego uczynność\n[na marginesie: N.B.] 3tio Maiąc we wszystkim JmPan Bun-\nczuczny z JmP. Łopottem Starostą Bobruyskim\ny pokazać z nim iunctim przyiaźń y stara-\nnie swoie dla mnie w przerzeczonym interessie\niak naylepiey ex dispondendo ad prosperum\neventum za co własne do zasłużenia za-\nwsze mam obowiązki.\n4to JmPana Starosty Bobruyskiego usilnie\nproszę aby znosząc się w tym z JmPanem\nBunczucznym y wspolnego do utrzymania\nKsiążęcia Jmci dokładaiąc starania da-\nwał mi znać iak nayprędzey przez roz-\nstawioną umyślnie pocztę ieżeli będą mo-\ngły wziąć skutek takowe intencye moie\nco uchoway Boże żeby inaczey stać się\nmiało.\n5to dla tym łatwieyszego pociągnie-\nnia przyiacioł in partem Książęcia Jmci\nStarosty listy moie na ustną relacyą JmP.\nStarosty Bobruyskiego, y JmP. Bunczucz-\nnego posyłam, ktore distribuendo komu\nbędą widzieli y komu należy [skreśl.: …] iako\nnayusilnieyszey dokładać będą sposobności\ndo pomyślnych skutkow desiderij mei.\n6to Z tey zaś przyczyny te puncta zapieczętowo-\nne aż tam na mieyscu odsyłaią aby\ntym bardziey był ukryty sekret y nie tak\nprędko był wyiawiony chyba w czasie\npotrzebnym gdyż przez wczesne odkry-\ncie iego mogliby przeciwni subminis-\ntrować [?] wiele ad impedienda haec pro-\nposita et desideria. Caetera activita-\nti, authoritati et solertiis [?] conatibus\npolecam. Dato w Nieswiżu d 9 Januarij\n1750"},{"n":84,"pages":"42","day":9,"language":"pol","addressee":"Chełchowski, pisarz skarbowy lit.","addressee_src":"Chełchowski, pisarz skarbowy lit.","addressee_status":"as in heading (no AM correction)","heading":"Do W JMcPana Chełchowskiego Pisarza Skarbowego W. Xtwa Litt. z Nieswiża","series":"Inne","persons":["Aleksandrowicz","Poddani adresata"],"intermediaries":[],"places":["Kleck","Nieśwież"],"institutions":["Magistrat nieświeski"],"topics":["Przemoc, zabójstwo, napaść","Spory sądowe i arbitraż"],"summary":"Pobicie Aleksandrowicza w Klecku przez poddanych adresata; żądanie sprawiedliwości.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W JMcPana Chełchowskiego Pisarza\nSkarbowego W. Xtwa Litt. z Nieswiża\nJadącego JMcPana Alexandrowicza w swo-\nim interessie nescio quo praetextu poddani\nWMcPana w stancyi śpiącego napadszy w Kle-\ncku crudeliter zbili y zmęczyli, w takowey\ntedy violencyi ucieka się JP. Alexandrowicz\no sprawiedliwe serce WMcPana za ktorym y Ja\nproszę, żebyś mu omnem raczył praestare iu-\nstitiam, lub takowych swawolnikow do Ma-\ngistratu Nieswizk[iego] pro convictione odesłał\nwierząc temu żem iest etc."},{"n":85,"pages":"42","day":9,"language":"pol","addressee":"Uzłowski, rotmistrz nowogródzki","addressee_src":"Uzłowski, rotmistrz nowogródzki","addressee_status":"as in heading (no AM correction)","heading":"Do W JMcPana Uzłowskiego Rotmistrza Wdztwa Nowogrodzkiego z Nieswiża d 9","series":"Inne","persons":["Aleksandrowicz","Poddani adresata"],"intermediaries":[],"places":["Kleck","Nieśwież"],"institutions":["Magistrat nieświeski"],"topics":["Przemoc, zabójstwo, napaść","Spory sądowe i arbitraż"],"summary":"Ta sama sprawa (napaść w Klecku), list do drugiego właściciela poddanych.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do W JMcPana Uzłowskiego Rotmistrza\nWdztwa Nowogrodzkiego z Nieswiża d 9\nJanu[arii] 1750. A[nn]o\nJakowy poniosł violencyą zaboystwa y mor-\nderstwa JMP. Alexandrowicz w Klecku\nw stancyi każdemu podrożnemu wolney\nsam fusius producet innocentiam suam\nia tylko convenio WMcPana żebyś tako-\nwe inconvenientye zganić Poddanstwu swemu [?]\nlub onych ad respondendum do Magistratu\nNieswizkiego pro hoc ausu odesłał pewien\nbędąc żem iest etc."},{"n":86,"pages":"42-43","day":9,"language":"pol","addressee":"Czartoryski Michał Fryderyk, podkanclerzy lit.","addressee_src":"Czartoryski, podkanclerzy w.lit.","addressee_status":"identified (AM)","heading":"Do JO Xcia Jmci Czartoryskiego Podkanclerzego W X Litt z Nieswiża d 9 Januarij.","series":"Inne","persons":["Przyjaciele adresata (grupa)","Senatorowie (grupa)","Radziwiłł Janusz Tadeusz","Radziwiłł Karol Stanisław \"Panie Kochanku\""],"intermediaries":[],"places":["Wilno","Litwa"],"institutions":["Trybunał Główny WXL","Sejmik gromniczny (deputacki)","Senat","Trybunał Skarbowy WXL"],"topics":["Kariera synów i krewnych","Trybunał Główny Litewski","Sejmiki (gromniczne, deputackie)","Urzędy i nominacje cywilne","Dobro publiczne, spokój w prowincji"],"summary":"Prośba do podkanclerzego o pomoc dla synów w zdobyciu deputacji; zapewnienie, że Rybeńko nie zrywa sejmików.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do JO Xcia Jmci Czartoryskiego Podkanclerzego\nW X Litt z Nieswiża d 9 Januarij.\nNiechcąc nic w życiu moim czynić około dobra pospolitego\nsam tylko moia osoba szukam pomocy w łasce WXMci\nupraszaiąc abyś dopomogł synom moim staraiącym\nsię a cunabulis iuż służąc y daley w Oyczyźnie\nmereri do funkcyi Deputackiey, na ktorey z laty będą\nsposobnieysi naśladować zasługi Przodkow moich y\nswoich w Oyczyźnie, iniże zas munia iako pioro ru-\nskie, y Laska Skarbowa iakom nigdy nikogo maim\nwłasnym sentymentem niepromowował, alem się zaw-\nsze ze wszystkiemi Senatorami będącemi w Wilnie zno-\nsił, tak y teraz upewniam za nikim nieproszę y [skreśl.: …] będę\nw tey mierze słuchał zdania WXMci ktore wiem,\nże będzie pro apto et idoneo subiecto, Przyiaciołom\nWXMci ani miałem intencyi po Seymikach szko-\ndzić, gdyż słowem podściwym [nad wierszem: upewniam] żem od tego czasu, iak-\nkem został Wdą Wileńskim z moiey woli żadne-\ngo Seymiku nie zerwano w Litwie, gdyż mam sobie\nza skrupuł, ażebym komukolwiek na promocyi\ndo dalszego szczęścia zaszkodził, y owszem mam zaw-\nsze sobie za naywiększą konsolacyą ażebym utrzymał,\na protestacye z moią bidą często z moim kosztem\nsprawy godząc y przypłacaiąc uspokaiam, y nigdy\nodemnie niedependuię, ieżeli się kto mieścić nie\nmoże, dadzą mnie w tey mierze naywiększe [?] ieżeli\nmam w tey naszey Prowincyi nieprzyiaciele świadectwo,\nzaczym w tym Wasza Xiążęca Mość niechciey wątpić o\nmnie, że iuxta posse uspokaiać będę byleby kto-\nry się czuie do czego tempestive mnie do pomocy\nswoiey wezwał, to [skreśl.: …] będę miał czas łatwiey służyć, a teraz\nimię moie affektowi WXcey Mci oddawszy sam\niestem z nieskończonym respektem. &c:"},{"n":87,"pages":"44","day":9,"language":"pol","addressee":"Ogiński Tadeusz Franciszek, kasztelan trocki","addressee_src":"Ogiński, kasztelan trocki","addressee_status":"identified (AM)","heading":"Do JW JmPana Ogińskiego Kasztellana Trockiego d 9 Januarij z Nieswiża","series":"Inne","persons":["Narbut Michał Józef, surogator ziemski lidzki [?]"],"intermediaries":[],"places":[],"institutions":["Trybunał Główny WXL","Sejmik gromniczny (deputacki)"],"topics":["Trybunał Główny Litewski","Sejmiki (gromniczne, deputackie)","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Poparcie kandydatury Narbutta do Trybunału; prośba o współpracę przy sejmikach.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW JmPana Ogińskiego Kasztellana Trockiego d\n9 Januarij z Nieswiża\nZ zwykłego u mnie szacunku każdych WMWMPana in-\nterpozycyi et ex recognitione wielkich przymiotow JmPa\nNarbutta Sędziego Lidzkiego, nietylko radbym go widział\nin functione na następuiący Tryb[unał] W X Litt, ale owszem\nsamego WMWMPana iak nayskutecznieyszey do utrzy-\nmania Seymikow Gromnicznych imploro kooperacyi\niako będący firmo corde, et tenerrima veneratione etc"},{"n":88,"pages":"44","day":9,"language":"pol","addressee":"Giecewicz Nikodem Ignacy, podstoli wileński","addressee_src":"Giecewicz, podstoli wileński","addressee_status":"identified (AM, matched by surname and office)","heading":"Do JP Giecewicza Podstolego Wdztwa Wileń[skiego] d 9 Januarij","series":"Inne","persons":[],"intermediaries":[],"places":["Wilno"],"institutions":["Sejmik gromniczny (deputacki)"],"topics":["Sejmiki (gromniczne, deputackie)","Wezwanie do przyjazdu, konferencja"],"summary":"Zapowiedź przyjazdu do Wilna na sejmiki gromniczne.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JP Giecewicza Podstolego Wdztwa Wileń[skiego] d 9 Januarij\nz Nieswiża\nJako na następuiące Seymiki Gromniczne spodziewam\nsię sam niechybnie zbieżeć do Wilna, tak na ten czas\nwszelką do ustney WMWMPana rezerwuię moią sposob-\nność, teraz mi tylko restat upewnić żem iest studio et\nvoto indesinenti etc"},{"n":89,"pages":"44","day":9,"language":"pol","addressee":"Mniszech Jerzy August, marszałek nadworny koronny","addressee_src":"Mniszech Jerzy August, marszałek nadworny koronny","addressee_status":"as in heading (no AM correction)","heading":"Do JW JmPana Mniszcha Marsz[ałka] Nadworn[ego] Koronnego z Nieswiża d 9 Januarij","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia i rewanż noworoczny.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW JmPana Mniszcha Marsz[ałka] Nadworn[ego] Koronnego\nz Nieswiża d 9 Januarij\nNietylko publica z okoliczności Świąt przepędzonych y no-\nwo zaczętego Roku, ale też et privata łaskawego WMWMPa-\nna oświadczenia perferre na sobie niemogę solatia bez wy-\nznania nayuniżeńszego WMWMPanu za tę nieustanną\ndla mnie łaskę podziękowania mego z wzaiemną Jemu\napprecacyą aby Nowonarodzony Pan tak benedicat initio\nanni praesentis, żebyś WMWMPan incolumis et robustus\nprzy iak nayzupełnieyszych pomyślnościach, tysiączne\npo nim mogł pędzić lata, a tego w nieodmiennym\nswoim konserwował sercu, ktory iest veneratione per-\nfecta etc"},{"n":90,"pages":"44-45","day":9,"language":"pol","addressee":"Puzyna, bp inflancki","addressee_src":"Puzyna, bp inflancki","addressee_status":"as in heading (no AM correction)","heading":"Do JW Jmci X[ię]dza Puzyny Biskupa Inflandskiego z Nieswiża d 9 Januarij","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":["Kościół (biskupstwo)"],"topics":["Życzenia świąteczne i noworoczne","Religia, Kościół, modlitwa"],"summary":"Podziękowanie za życzenia.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW Jmci X[ię]dza Puzyny Biskupa Inflandskiego\nz Nieswiża d 9 Januarij\nChoć w nowo zaczętym Roku y nowy iednak odbieraiąc\ndowod nieustanney dla mnie łaski dobroczynności\nWMWMPana, wyznaię naprzod iak nayuniżeńsze\nJemu podziękowanie moie, a oraz tych mu ad multos\nannos circa incolumitatem zdrowia z błogosławieństwem\nNowonarodzonego Pana życzę szczęśliwości, ktore voto sa-\nmego WMWMPana exoptari mogą, a dla siebie wię-\ncey niepragnę iako tylko być cultu perenni etc"},{"n":91,"pages":"45","day":9,"language":"pol","addressee":"Czartoryski, wojewoda ruski","addressee_src":"Czartoryski, wojewoda ruski","addressee_status":"as in heading (no AM correction)","heading":"Do JO Xcia Jmci Czartoryskiego Wdy Ruskiego z Nieswiża d 9 Januarij","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia i rewanż.","certainty":"high","uncertain":3,"hand_change":false,"notes":"","text":"Do JO Xcia Jmci Czartoryskiego Wdy Ruskiego\nz Nieswiża d 9 Januarij\nTaż sama obligacya, ktora y mnie antiquo [?] ku WXMci\nmię adstrinxit devotione wzbudza we mnie nieustan-\nne do życzenia Jemu obowiązki, przy wyświadczeniu\nktorych niosę naprzod WXMci nayuniżeńsze moie za\nwyrażone apprecacye podziękowanie, a oraz tych mu\nwzaiemnie a datore munerum od Nowonarodzonego Pa-\nna w Roku Nowozaczętym, a po nim ultinam [?] iak\nnaydłuższych kwitach [?] życzę sukcessow, ktore zupełnie\nWXMć mogą uszczęśliwić y kontentować mogą, a mnie do-\nsyć na tym żem iest indesinenti veneratione etc"},{"n":92,"pages":"45","day":9,"language":"pol","addressee":"Narbutt, sędzia lidzki","addressee_src":"Narbut, sędzia ludzki","addressee_status":"as in heading (no AM correction)","heading":"Do JP Narbutta Sędziego Lidzkiego d 9 Januarij","series":"Inne","persons":[],"intermediaries":[],"places":[],"institutions":["Trybunał Główny WXL"],"topics":["Trybunał Główny Litewski","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Pochwała zamiarów Narbutta i zapowiedź radości z jego sukcesu.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"Do JP Narbutta Sędziego Lidzkiego d 9 Januarij\nz Nieswiża\nChwalebne WMWMPana ad benemerendum de publi-\nco intencye, iako znayduią u mnie plausum et estima-\ntionem, tak upewniam WMWMPana iż z szczęśliwych\nJego w tym punkcie sukcessow całym sercem cie-\nszyć się y winszować będę, ktorym teraz iestem ad\nquaeq[ue] vota etc"},{"n":93,"pages":"45","day":9,"language":"lat","addressee":"Rhor, major","addressee_src":"Rhor, major","addressee_status":"as in heading (no AM correction)","heading":"Ad Mfcum Dnum Rhor d 9 Januarij Nieswisij","series":"Inne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Poczta, przesyłanie listów i wiadomości"],"summary":"Potwierdzenie listu z 18 [grudnia]; oczekiwanie dalszej korespondencji (łac.).","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Ad Mfcum Dnum Rhor d 9 Januarij Nieswisij\nLiteris Mfcae D[omina]tionis V[est]rae mensis d 18 et anni elapsi\nad me datis solita gratitudine acceptis expecto ulte-\nriorem et interruptam abeo [?] succedendorum communi-\ncationem pro praesenti in continua permanens obli-\ngatione etc"},{"n":94,"pages":"45-46","day":9,"language":"pol","addressee":"Sapieha Ignacy, podskarbi nadworny lit.","addressee_src":"Sapieha, podskarbi nadworny lit.","addressee_status":"identified (AM)","heading":"Do JW JPana Sapiehy Podskarbiego Nadwornego W X Litt d 9 Januarij z Nieswiża","series":"Życzenia noworoczne","persons":["Córka adresata (zmarła)","August III Wettyn, król Polski"],"intermediaries":[],"places":["województwo wołyńskie [?]"],"institutions":["Dwór królewski"],"topics":["Życzenia świąteczne i noworoczne","Choroba, śmierć, kondolencje","Urzędy i nominacje cywilne"],"summary":"Kondolencje po śmierci córki adresata; o wakującym urzędzie (województwo wołyńskie [?]): Rybeńko może o nim „bardziej optare, quam sperare”.","certainty":"medium","uncertain":4,"hand_change":false,"notes":"","text":"Do JW JPana Sapiehy Podskarbiego Nadwornego\nW X Litt d 9 Januarij z Nieswiża\nOdebrane razem de eadem data dwa listy WMWM-\nPana przymnożyły znacznie we mnie za życzliwe\nvotorum oświadczenie obligacyi, ktore przy nayuniżeń-\nszym wyznaiąc podziękowaniu, pari mu voto życzę\naby Nowonarodzony Pan iako consolator optimus strosku-\nnie [?] WMWMPaństwa stratą Corki Ich [?] nad ktorą ser-\ndecznie compatior, serce millenis napełnił solatijs, a\nRoku nowozaczęty feliciori succedat auspicio. Co się zaś ty-\ncze promocyi do wakuiącego W[oiewo]dztwa [?] Wołyń[skiego] [?] pewien tego\nniewątpię WMWMPan iesteś, iż nietylko z wrodzo-\nnych ale też y partykularnych moich ad usus Jego\naddykcyi, radbym w tym punkcie dla niego Nayiaśn[ieyszego]\nPana zieднać gratiam efficacem, ale kiedy w teraź-\nnieyszych koniunkturach bardziey tylko tego optare,\nquam sperare mogę, więc tylko votis chyba y praw-\ndziwą żądzą staraniu WMWMPana dopomagać\nbędę, nie zaniedbywaiąc przecież tych ktore będę rozu-\nmiał nayskutecznieysze sposobow, na dowod, iako\niestem infinita cordis propensione etc"},{"n":95,"pages":"46","day":9,"language":"fr","addressee":"Wackerbarth","addressee_src":"Wackerbarth","addressee_status":"as in heading (no AM correction)","heading":"a S.E. Mgr le Comte de Wackerbarth Ministre de Saxe le 9 Janvier 1750 a Nieswiz","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia (fr.).","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"a S.E. Mgr le Comte de Wackerbarth Ministre de\nSaxe le 9 Janvier 1750 a Nieswiz\nEn revanche du bien, dont votre Excellence me fait sentir\ntoute la force dans la substance de sa congratulation\nqu'elle a bien voulu m'adresser à l'occasion du renouvel-\nlement de l'année, je ne puis lui temoigner, qu'une extreme\nenvie, que j'ai de reconnoitre cette demonstration ecla-\ntante de son affection par tout ce qu'il y a de plus fort\net de plus réel dans la formalité d'une gratitude la plus\nsolennelle. Votre Excellence peut bien juger par ces traits\nde mon devouement sans reserve que les termes les plus\nforts sont les plus foibles pour egaler l'etendue des\nvoeux reciproques, que je ne cesse de faire pour tout\nce qui fait le principal objet de sa satisfaction et de ses\njustes desirs. C'est dans ce peu de mots, que je concentre\ntous mes souhaits, comme autant de garants de l'atta-\nchement inviolable, avec lequel j'ai l'honneur d'etre"},{"n":96,"pages":"46-47","day":9,"language":"fr","addressee":"Vincenti Etienne Auguste, jałmużnik króla i kanonik warszawski","addressee_src":"Vincenty, abbe","addressee_status":"identified (AM)","heading":"a Mr Vincenti le 9 Janvier 1750 a Niesviz","series":"Inne","persons":["Tarło Jan, wojewoda sandomierski"],"intermediaries":[],"places":[],"institutions":[],"topics":["Dyplomacja i sprawy zagraniczne","Choroba, śmierć, kondolencje","Poczta, przesyłanie listów i wiadomości","Polityka dworska i frakcyjna"],"summary":"Niepokój o negocjacje i ciężką chorobę wojewody sandomierskiego; prośba o dalsze wiadomości (fr.).","certainty":"medium","uncertain":0,"hand_change":false,"notes":"","text":"a Mr Vincenti le 9 Janvier 1750 a Niesviz\nIl y a de quoi s'attrister, tant à cause, que les Parties oppo-\nsées au lieu d'avancer dans l'affaire d'une negotiation\npret à entamer, ont quelque mine de vouloir aller à re-\nculons; que parceque la maladie dangereuse de S.E. Mgr\nle Palatin de Sandomir menace tout le Royaume d'une me-\nnace aussi tragique, que celle de voir tomber un puissant sou-\ntien de la Republique. Dieu veuille, que de ces deux desastres\nen question, ni l'un ni l'autre ne soit averé par des effets\neffectifs. Agité la-dessus par les differentes pensées, je n'ai fait\nqu'attendre avec impatience les avis que vous aurez la bon-\nté de me donner à cet egard. La continuation de votre cor-\nrespondence me servira d'eguillon pour me porter à re-\nconnoitre votre attention par des nouvelles marques\nde l'amitié la plus sincere avec laquelle je suis"},{"n":97,"pages":"47","day":9,"language":"pol","addressee":"Zamoyski, starosta ploskirowski","addressee_src":"Zamoyski, starosta ploskirowski","addressee_status":"as in heading (no AM correction)","heading":"Do W Jmci Pana Zamoyskiego St[aros]ty Płoskirowskiego d 9 Januarij z Nieswiża","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Rewanż życzeń noworocznych.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do W Jmci Pana Zamoyskiego St[aros]ty Płoskirowskie-\ngo d 9 Januarij z Nieswiża\nDość uprzeyme WMWMPana vota do tey mię pocią-\ngaią obligacyi, abym za nie moie wyraziwszy podzięko-\nwanie quaeq[ue] optabilia życzył, iako z tego szczerością\npragnę chęci, abyś WMPan przy uniwersalney całego\nświata wesołości żadnych niedoznaiąc insidiae sortis\ncasus inseros annos z całym Domem wszelkich po-\nmyślności cieszył się sukcessami w Nowych [nad wierszem: z Roku] no-\nwych zawsze a coraz większych fortun szczęścia y ho-\nnorow dochodząc stopniow, co wszystko ad mea vo-\nta gdy stanie się na partykularną pragnieniu\nbędzie to satysfakcyą y ukontentowanie tego, kto-\nry iest diffuso [?] corde etc"},{"n":98,"pages":"47-50","day":9,"language":"pol","addressee":"Massalski Michał Józef, kasztelan wileński","addressee_src":"Massalski Michał Józef, kasztelan wileński","addressee_status":"as in heading (no AM correction)","heading":"Do JW JmPana Massalskiego Kasztellana Wileńskiego Het[mana] Pol[nego] W X Litt z Nieswiża d 9 Januarij","series":"Inne","persons":["Czartoryski Michał Fryderyk, podkanclerzy lit.","Deputaci grodzieńscy (grupa)","Dyspozytor wieliski [?]","NN, deputaci lidzcy","Mengotin [?]","Plater, deputat wiłkomierski","Flemming Jerzy Detloff, podskarbi w.lit.","Przyjaciele podkanclerzego (grupa)","Radziwiłł Janusz Tadeusz","Radziwiłł Karol Stanisław \"Panie Kochanku\""],"intermediaries":[],"places":["Nowogródek","Wilno","Grodno"],"institutions":["Trybunał Główny WXL","Sejmik gromniczny (deputacki)","Trybunał Skarbowy WXL","Skarb WXL"],"topics":["Kariera synów i krewnych","Trybunał Główny Litewski","Sejmiki (gromniczne, deputackie)","Urzędy i nominacje cywilne","Dobro publiczne, spokój w prowincji","Polityka dworska i frakcyjna"],"summary":"Długi list programowy: synowie do służby publicznej; odparcie zarzutu zrywania sejmików; Pióro Ruskie i laska Trybunału Skarbowego.","certainty":"medium","uncertain":5,"hand_change":false,"notes":"","text":"Do JW JmPana Massalskiego Kasztellana Wileń-\nskiego Het[mana] Pol[nego] W X Litt z Nieswiża d 9 Januarij\nJako niepowstały nigdy w myślach przez cały przeciąg\nlat moich insze intencye y przedsięwzięcia we mnie\nnad te, ktore respiciunt bonum publicum integritatem\npraw y swobod Oyczystych, tak y teraz co firmius\nstwierdzone y umocnione są we mnie, kiedy dla\ntey Oyczyzny, ktorey wszystko sakryfikować goto-\nwem: quidquid charioris habeo umyśliłem conse-\ncrare cara pignora mea disponendo Synow moich\ndo tey publiczney usługi, eo motivo et studio abym\nw Imieniu y następcach moich nieodmienne y\nnieodstępne dla Dobra pospolitego odkrył sen-\ntymenta. Aże JWWMPan pro teneritudine sua ku mnie do-\nkładać raczysz ad haec subsequenda wszelkich sposobno-\nści, y listem moim pisanym do Xcia Jmci Podkanclerze-\ngo, ktory kopiatim kommunikuię quod chcesz amore\nrenovato [?], niemogę fidelius komu, iako rectitudi-\nne sensuum dla Oyczyzny wyprobowanemu, a ta-\nkiemu kolledze memu powierzyć takowey expe-\ndycyi, spodziewaiąc się że et in hac facilitate mea\ndla powszechney spokoyności uznasz sam WMWM-\nPan, iż non quaero utile sed honestum, ani też privatum\nlecz publicum zawsze.\nCo się zaś ściąga do Seymikow następuiących aże\nbym nie subministrował iakowych przeszkod Przy-\niaciołom Xcia Jmci Podkanclerzego, rzecz iest dzi-\nwna, y mnie intollerabilis, iesteś bowiem sam WMPan\nwiadom aequitatis et rectitudinis meae, że się w ta-\nkie rzeczy nigdy in tractu wieku mego nie udawa-\nłem, abym miał disponere kogo do zerwania\ntakowych Seymikow, boby to mnie było nec licitum\nnec decorum, ani wynaydować takowych sposo-\nbow, iakich wcześnie zażywaią inni, poka[zu]ie bo-\nwiem dokumentem list dyspozytora wieliźkiego [?]\nktorym animuie Przyiacioł swoich w Nowogrod-\nku ad obstandum przeciwney stronie, ktora nie\nwiem w kim ma się rozumieć, bo my ad classica [?]\nnieprzyszli y nikomu ad bella gerenda u nas oka-\nzyi niedali, ieżeli zaś to się ściąga do Seymikow\nnastępuiących, to tam powinna być unio animorum,\ngdyż nie dzieląc się in partes, wszyscy do tego concurre-\nre powinniśmy aby zaszczyt swobod szlacheckich\nin integro był zachowany. Ja iako zawsze iestem\nw takich okolicznościach dalekim ab intentione\nnocendi, tak y teraz zachowam intaminatam fidem\nmeam, proszę tylko wzaiemney Xcia Jmci Podkan-\nclerzego uczynności, aby Przyiaciołom moim niekazał\nczynić ad obtinendum hunc characterem po Wdzt-\nwach żadney przeciwności.\nA iako niebyły skryte WMWMPanu in ante\nwszystkie ad operandum bonum starania moie\nw ułatwieniu circa fundandam iurisdictionem Trybuna-\nłu zachodzących obranym Deputatom obiekcyi, tak\ny na przyszłym, ieżeli evenient iakie a nobilitate,\nwszelką usilnością ad conciliandos animos dokła-\ndać się nie omieszkam, tam iednak gdzie może\nzachodzić possibilitas, et amicorum do ułagodzenia\nprotestantow valebunt persuasiones, wszakże\ny przeszłych Trybunałow sane pokazałem aequa-\nnimitatem, bo lubo przywiązani mi byli Jchmość\nPP. Lidzcy [?], tudzież JmP Plater Wiłkomirski, post-\nhabito omni respectu na wszystko dogadzaiąc, tylko\nprawu oddalić musiałem dla zachodzących oppo-\nzycyi iakoż y dawniey stało z Grodzieńskiemi De-\nputatami dla JmPana Mengotina, gdzie samego\nWMPana niemała zachodziła praca, mogą się tedy\ny teraz nadać takie okoliczności, że kogoś [?] cedere\npotrzeba będzie, ile kiedy dla interessow swoich\ny inne do takich trudności Familie mieszać się\n[kustosz: mogą]\nPioro Ruskiego nikomu deklarować nie będę za-\nchowuiąc się w tym do zdania Xcia Jm Podkancle-\nrzego y samego WMPana, tudzież zgromadzonych\nad actum inchoationis do Wilna.\nLaska Trybunału Skarbowego iako concernit mi-\nnisterium Skarbu W X Litt y nas Hetmanow, tak\nkogo providebit sobie JW Jm P Podskarbi W W\nX Litt nie będę contrarius onemu, upewniam, zosta-\niąc z nieporownanym przywiązaniem circa infini-\ntum cultum &c:"},{"n":99,"pages":"50","day":9,"language":"pol","addressee":"Wolski Władysław Michał, skarbnik nowogródzki","addressee_src":"Wolski, skarbnik nowogródzki","addressee_status":"identified (AM)","heading":"Do W Jm Pana Wolskiego Skarbnika Nowogrodzkiego z Nieswiża d 9 Januarij","series":"Inne","persons":["Krzyszłowski Michał, koniuszy nowogródzki"],"intermediaries":["Krzyszłowski Michał, koniuszy nowogródzki"],"places":["Nieśwież"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca","Wezwanie do przyjazdu, konferencja"],"summary":"Odesłanie do ustnej relacji koniuszego nowogródzkiego; wezwanie do Nieświeża na wtorek.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jm Pana Wolskiego Skarbnika Nowogrodzkiego\nz Nieswiża d 9 Januarij\nJako iestem zupełnie perswasus o łaskawym WMWM-\nPana ku sobie sercu, tak kiedy mi one maiori do tego\niescze potwierdził sponsione Jm Pan Koniuszy Nowo-\ngrodzki, daię z poufałą prozbą moią do WMWMPana,\nażebyś to wszystko cokolwiek ustney tegoż Jm Pana\nKoniuszego poleciłem remonstracyi, amico suo corde\nprosequi raczył, y mnie w przyszły wtorek niechy-\nbnie bytność swoią w Nieswiżu darować raczył,\nktorey iako avidissime oczekiwać będę, tak piszę\nsię voto indesinenti &c:"},{"n":100,"pages":"50","day":9,"language":"pol","addressee":"Bułhak, łowczy miński","addressee_src":"Bułhak, łowczy miński","addressee_status":"as in heading (no AM correction)","heading":"Do W Jm Pana Bułhaka Łowczego Minskiego z Nieswiża d 9 Januarij","series":"Inne","persons":["Krzyszłowski Michał, koniuszy nowogródzki"],"intermediaries":["Krzyszłowski Michał, koniuszy nowogródzki"],"places":[],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Odesłanie do ustnej relacji koniuszego nowogródzkiego (list urwany na s. 50) <h2>Transcription</h2><p>Diplomatic, produced by a language model and checked a second time against the image of every page. Conventions: <code>[ ]</code> expanded abbreviation, <code>[?]</code> uncertain reading, <code>[…]</code> illegible passage, <code>[skreśl.: …]</code> deletion, <code>[nad wierszem: …]</code> interlinear addition, <code>[na marginesie: …]</code> marginal note, <code>[inna ręka]</code> another hand. The sample contains 106 uncertain readings. The text has not yet been verified by a palaeographer and should not be quoted without checking.</p>
