<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --panel: #fcfcfb; --line: #e2e0da; --fg: #0b0b0b; --fg2: #52514e; --fg3: #77756f;
  --grid: #ecebe6; --axis: #b9b7ae; --muted-mark: #c9c7bf; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --seq0: #cde2fb; --seq1: #0d366b;
  --hl: #fff4c2; --shadow: 0 4px 16px rgba(0,0,0,.12);
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --panel: #1a1a19; --line: #33332f; --fg: #f0efec; --fg2: #c3c2b7; --fg3: #9a998f;
    --grid: #262624; --axis: #55544f; --muted-mark: #4a4945; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    --seq0: #1f2a38; --seq1: #86b6ef; --hl: #3d3520; --shadow: 0 4px 16px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --panel: #1a1a19; --line: #33332f; --fg: #f0efec; --fg2: #c3c2b7; --fg3: #9a998f;
  --grid: #262624; --axis: #55544f; --muted-mark: #4a4945; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
  --seq0: #1f2a38; --seq1: #86b6ef; --hl: #3d3520; --shadow: 0 4px 16px rgba(0,0,0,.5);

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
.wrap > *, [data-panel] > * { min-width: 0; }
.wrap { grid-template-columns: minmax(0, 1fr); }
[data-panel] { min-width: 0; }
table.t td { overflow-wrap: anywhere; }
header.top { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
header.top h1 { font-family: var(--serif); font-weight: 400; font-size: 1.85rem; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
header.top p { margin: 0; max-width: 78ch; color: var(--fg2); }
.btn { font: inherit; font-size: .85rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); cursor: pointer; }
.btn:hover { border-color: var(--axis); }
.btn:focus-visible, select:focus-visible, input:focus-visible, tr:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
nav.tabs button { font: inherit; font-size: .92rem; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--fg2); cursor: pointer; margin-bottom: -1px; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.kpi .v { font-family: var(--serif); font-size: 2rem; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.kpi .l { font-size: .82rem; color: var(--fg2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
.card .note { font-size: .82rem; color: var(--fg2); margin: 0 0 12px; max-width: 80ch; }
.chart { position: relative; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--fg2); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: .7rem; height: .7rem; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; background: var(--sw); }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 12px; font-size: .82rem; }
.controls label { display: grid; gap: 4px; color: var(--fg2); }
select, input[type=search] { font: inherit; font-size: .88rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); min-width: 0; }
input[type=search] { width: min(100%, 260px); }
.check { display: flex !important; grid-auto-flow: column; align-items: center; gap: 6px !important; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 9px; font-size: .8rem; max-width: 20rem; z-index: 5; }
.tip .k { color: var(--fg2); }
.tip b { font-weight: 600; }
.netbox { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); touch-action: none; }
.netbox svg { display: block; cursor: grab; }
.netbox svg:active { cursor: grabbing; }
.netbtns { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.netbtns .btn { padding: 2px 9px; }
.info { font-size: .86rem; margin-top: 12px; min-height: 3rem; }
.info .pill, .pill { font: inherit; font-size: .78rem; display: inline-block; padding: 1px 8px; margin: 2px 4px 2px 0; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
.pill:hover { border-color: var(--accent); }
.tablebox { max-height: 34rem; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.t th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
table.t th[aria-sort="ascending"]::after { content: " ↑"; color: var(--fg3); }
table.t th[aria-sort="descending"]::after { content: " ↓"; color: var(--fg3); }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover { background: var(--bg); }
table.t td.num { font-variant-numeric: tabular-nums; text-align: right; }
.cnt { font-size: .82rem; color: var(--fg2); }
.cert { font-size: .75rem; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.dlg-head h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 1.3rem; }
.dlg-head .sub { font-size: .82rem; color: var(--fg2); }
.dlg-body { padding: 14px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; }
@media (max-width: 760px) { .dlg-body { grid-template-columns: 1fr; } }
dl.meta { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: .84rem; }
dl.meta dt { color: var(--fg2); }
dl.meta dd { margin: 0; }
pre.tx { font-family: var(--mono); font-size: .8rem; line-height: 1.55; white-space: pre-wrap; margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; max-height: 60vh; overflow: auto; }
pre.tx mark { background: var(--hl); color: inherit; border-radius: 2px; }
.dlg-nav { display: flex; gap: 6px; }
.method { font-size: .88rem; color: var(--fg2); max-width: 85ch; display: grid; gap: 10px; }
.method h2 { color: var(--fg); font-size: 1.05rem; margin: 0; }
.method p { margin: 0; }
.method code { font-family: var(--mono); font-size: .8rem; }
[hidden] { display: none !important; }
footer { font-size: .78rem; color: var(--fg3); }
</style>
