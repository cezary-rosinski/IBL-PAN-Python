ressee_src":"Kurzeniecki, podczaszy piński i sędzia grodzki piński","addressee_status":"identified (AM)","heading":"Do W Jm Pa Kurzenieckiego Podczaszego y Sędziego Grodz[kiego] Pow[ia]tu Pinskiego z Nieswiża d 1ma Januarij","series":"Seria pińska (1 I)","persons":["Orzeszko Leopold, pisarz grodzki piński","Przyjaciele adresata (grupa)"],"intermediaries":["Orzeszko Leopold, pisarz grodzki piński"],"places":["powiat piński"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca","Wezwanie do przyjazdu, konferencja"],"summary":"Formularz serii pińskiej; w dopisku prośba o krótki przyjazd do Rybeńki.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do W Jm Pa Kurzenieckiego Podczaszego y Sędziego Grodz[kiego]\nPow[ia]tu Pinskiego z Nieswiża d 1ma Januarij\nDoznane [skreśl.: …] tot documentis łaskawe WMWM Pane\nserce, attollit mnie w nadziei że w Intentach moich ple-\nniori ore WJP Pisarza Grodz[kiego] Pow[ia]tu Pinsk[iego] na ktorego się zu-\npełnie referuię ad exponendum WMWM Pu poleconych\nskuteczną łaskę Jego pozyskać będę mogł, ale też y z [?]\nPrzyiacioł swoich plenaqua polles activitate ad hac na-\n[na marginesie: B] kłonisz, iako wnoszę enixam oto do WMWM Pa Interpo-\nsitionem meam, tak si quis usus mej będzie nieu-\nstannemi zasłużyć conabor usługami piszęcy się\nInterminabili Voto etc. P.S. Chciey na krotki czas do mnie\n[pod wierszem:] zjechać, odsłużę tę łaskę"},{"n":6,"pages":"2-3","day":1,"language":"pol","addressee":"Orzeszko Michał Stanisław, marszałek piński","addressee_src":"Orzeszko, marszałek piński","addressee_status":"identified (AM)","heading":"Do W Jm P Orzeszki M[arsza]łka Pow[ia]tu Pinskiego d 1ma Januarij z Nieswiża","series":"Seria pińska (1 I)","persons":["Orzeszko Leopold, pisarz grodzki piński","Przyjaciele adresata (grupa)"],"intermediaries":["Orzeszko Leopold, pisarz grodzki piński"],"places":["powiat piński"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Formularz serii pińskiej: prośba o „manutencję” zamiarów Rybeńki wspólnie z przyjaciółmi; treść powierzona ustnie pisarzowi grodzkiemu pińskiemu.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jm P Orzeszki M[arsza]łka Pow[ia]tu Pinskiego d 1ma\nJanuarij z Nieswiża\nSzukać w przychilnym WMWM Pana, a nigdy nie odmien-\nnym ku mnie sercu, auxiliatrices gratias Jego, iako mi iest\nzawsze optatissimi voti tak [eo?] instincta wnoszę iak nay-\nusilnieysze prozby moie do WMWM Pana, ażebys polecon-\nnym pleniori labio WJP Pisarza Grodz[kiego] Pow[ia]tu Pinskiego Inten-\ntom moim, na ktorego zupełną zdaię się remonstracyą, nie\ntylko magna tutamina łaski swoiey wespoł z Przyiacioła-\nmi swemi praestare, ale też z skuteczną kooperacyą swoią\n[na marginesie: B] ad optatissimum eventum succurrere raczył, co iako\nwłasnemi usługami Intentissimo studio zasłużyć sta-\nrać się będę, tak wyznawać nie przestanę żem iest ad\nOmnes nutus etc"},{"n":7,"pages":"3","day":1,"language":"pol","addressee":"Protasowicz Adam Józef, podstarości piński","addressee_src":"Protasowicz, podstarości piński","addressee_status":"identified (AM)","heading":"Do Jm Pana Protasowicza Podstarościego Pow[ia]tu Pinskiego d 1ma Januarij z Nieswiża","series":"Seria pińska (1 I)","persons":["Orzeszko Leopold, pisarz grodzki piński","Przyjaciele adresata (grupa)"],"intermediaries":["Orzeszko Leopold, pisarz grodzki piński"],"places":["powiat piński"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Formularz serii pińskiej: prośba o „manutencję” zamiarów Rybeńki wspólnie z przyjaciółmi; treść powierzona ustnie pisarzowi grodzkiemu pińskiemu.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do Jm Pana Protasowicza Podstarościego Pow[ia]tu\nPinskiego d 1ma Januarij z Nieswiża\nO łaskawym WMWM Pana et in quaeq[ue] vota mea przy-\nchylnym perswasus będąc sercu, wątpić niemogę że co-\nkolwiek exponet WMWM Pu WJP Pisarz Grodz[ki] Pow[ia]tu Pinsk[iego]\nInterpres voti et Intentiones mea, na ktorego się zupeł-\nnie referuię, nie tylko to approbować zechcesz, ale też y\nswoiey skuteczney iunctim z Przyiaciołami swemi za-\nszczycisz manutencyi, wnosząc oto enixas preces me-\nas w nieskończonych do zasłużenia iemu zostawać będę\nobowiązkach, pisząc się Voto Indesinenti etc"},{"n":8,"pages":"3","day":1,"language":"pol","addressee":"Rodziewicz Jan, oboźny piński","addressee_src":"Rodziewicz, oboźny piński","addressee_status":"identified (AM)","heading":"Do W Jm Pana Rodziewicza Oboźnego Pow[ia]tu Pinsk[iego] d 1ma Januarij z Nieswiża","series":"Seria pińska (1 I)","persons":["Orzeszko Leopold, pisarz grodzki piński","Przyjaciele adresata (grupa)"],"intermediaries":["Orzeszko Leopold, pisarz grodzki piński"],"places":["powiat piński"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Formularz serii pińskiej: prośba o „manutencję” zamiarów Rybeńki wspólnie z przyjaciółmi; treść powierzona ustnie pisarzowi grodzkiemu pińskiemu.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jm Pana Rodziewicza Oboźnego Pow[ia]tu Pinsk[iego]\nd 1ma Januarij z Nieswiża\nPolecone maiąc sobie ustney remonstracyi WJPan Pisarz\nGrodz[ki] Pow[ia]tu Pinsk[iego] quaeq[ue] vota et Intentiones meas, na kto-\nrego się zupełnie referuię, szukać będzie łaskawey WMWM\nPana onych manutencyi, y Ja in subsidium przy-\ndaiąc iak nayuniżeńszą prozbę moią, ażebys raczył mi\nbyć auxiliaris et Suffragarius wespoł z Przyiaciołami\nswemi, tak cokolwiek uznam łaskawey Jego uczynno-\nści wszystko to perenni studio zawdzięczyć conabor pi-\nsząc się Voto Indesinenti etc"},{"n":9,"pages":"3-4","day":1,"language":"pol","addressee":"Szyrma Paweł Antoni, pisarz ziemski piński","addressee_src":"Szyrma, pisarz ziemski piński","addressee_status":"identified (AM)","heading":"Do W Jm Pana Szyrmy Pisarza Ziemskiego Pow[ia]tu Pinskiego z Nieswiża d 1ma Januarij.","series":"Seria pińska (1 I)","persons":["Orzeszko Leopold, pisarz grodzki piński","Przyjaciele adresata (grupa)"],"intermediaries":["Orzeszko Leopold, pisarz grodzki piński"],"places":["powiat piński"],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo","Odesłanie do ustnej relacji posłańca"],"summary":"Formularz serii pińskiej: prośba o „manutencję” zamiarów Rybeńki wspólnie z przyjaciółmi; treść powierzona ustnie pisarzowi grodzkiemu pińskiemu.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do W Jm Pana Szyrmy Pisarza Ziemskiego Pow[ia]tu\nPinskiego z Nieswiża d 1ma Januarij.\nPewien będąc łaskawie dysponowanego zawsze ku mnie\nWMWM Pana serca, tak in fiducia recenseo [?] iak nayuni-\nżeńsze prozby moie, ażebys poruczonych pleniori remon-\nstrationi W Jm Pana Pisarza Grodz[kiego] Pow[ia]tu Pinskiego Intencyach\nmoich, na ktorego się totaliter referuię magno tutami-\nne et auxilio wespoł z Przyiaciołami swemi prodesse raczył.\nObowiążesz mię przezto WMWM Pan millenis motivis do\n[skreśl.: ne] nieskończonego mego iemu zasłużenia, y tego wyznania\nżem iest cunctorum Nutuum etc"},{"n":10,"pages":"4","day":2,"language":"pol","addressee":"Tyszkiewicz Antoni Dominik, bp żmudzki","addressee_src":"Tyszkiewicz, bp żmudzki","addressee_status":"identified (AM, propagated)","heading":"Do J. W. J. M. Ci X. Tyszkiewicza Biskupa Żmudzkiego d 2 Januarij 1750 z Nieswieża","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":["Kościół (biskupstwo)"],"topics":["Życzenia świąteczne i noworoczne","Religia, Kościół, modlitwa"],"summary":"Podziękowanie za życzenia i rewanż noworoczny.","certainty":"high","uncertain":0,"hand_change":true,"notes":"","text":"[inna ręka]\nDo J. W. J. M. Ci X. Tyszkiewicza Biskupa\nŻmudzkiego d 2 Januarij 1750 z Nieswieża\n[na marginesie: B] Y Dawnieysze łaski JWWMcPana Dobrodz[ieja]\ndla mnie świadczone, et recentia specimina\nw wyrażonych apprecacyach odebrane, pobudzaią\nmnie do oświadczenia nayuniżeńszego WM-\nWMcPana podziękowania et ad mutua vota: aże-\nbyś WMWMcPan z błogosławieństwem No-\nwonarodzonego Pana incolumis et plenus pro-\nsperitatum, nie tylko ten nowo zaczęty Rok\nale też tysiączne przepędzał lata, pro solatio\npublico et particulari będącego infinito cultu"},{"n":11,"pages":"4","day":2,"language":"pol","addressee":"Rudziński, kasztelan czerski","addressee_src":"Rudzińsk, kasztelan czerski","addressee_status":"as in heading (no AM correction)","heading":"Do JWJMci Pana Rudzinskiego Kasztellana Czerskiego. z Nieswiża d 2 Janu[arii] 1750","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia świąteczne.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JWJMci Pana Rudzinskiego Kasztella-\nna Czerskiego. z Nieswiża d 2 Janu[arii] 1750\n[na marginesie: B] Z szczerą obowiązanego serca wdzięcznością\nprawdziwą zawsze do usług WMcPana Dobro-\ndzieja niosę nayuniżeńsze Jemu podziękowanie\nmoie za wyrażone vota in recursu Świąt prze-\npędzonych, ex occasione ktorych pari animo\nżyczę y tego serdecznie pragnę, aby Nowonarodzo-\nny Pan to wszystko confirmet et tribuat,\ncokolwiek iest we mnie życzliwych Jemu\nżądź y votorum pro prosperrimis successibus\nJego, ad singulare solatium piszącego się\nbyć indesinenti veneratione etc."},{"n":12,"pages":"4-5","day":2,"language":"pol","addressee":"Ogiński Ignacy, marszałek nadworny lit.","addressee_src":"Ogiński, marszałek nadworny lit.","addressee_status":"identified (AM, propagated)","heading":"Do JWJMci Pana Ogins[ki]ego Marszałka Nadwornego W. X. Litt. d 2. Januarij z Nieswiża","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia; życzenia zdrowia.","certainty":"medium","uncertain":1,"hand_change":false,"notes":"","text":"Do JWJMci Pana Ogins[ki]ego\nMarszałka Nadwornego W. X. Litt.\nd 2. Januarij z Nieswiża\nZ obfitych wszystkich ktoremi WMPan\nad recursum Świąt przepędzonych z ta-\n[kustosz, nieczytelny]\n[…]wości swoiey wyrażać raczysz appreca-\ncyi, [skreśl.: …] Pana in sortem WMWMcPana\ncumendo [?] vota, niosę naprzod nayuniżeń-\nsze moie za tę Jego łaskę podziękowa-\nnie, a oraz wzaiemnie życzę iak nay-\nzupełnieyszych WMWMcPanu circa in-\ncolumitatem zdrowia w pozne lata pomyśl-\nności et in tali voto piszę się być plena\nveneratione etc:"},{"n":13,"pages":"5","day":2,"language":"pol","addressee":"Petrusewicz","addressee_src":"Petrusewicz","addressee_status":"as in heading (no AM correction)","heading":"Do JMcPana Petrusewicza d 2 Jan[uarii] z Nieswiża 1750 A[nn]o","series":"Inne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Protekcja, rekomendacja, wstawiennictwo"],"summary":"Zapewnienie gotowości do usług na przyszłe prośby adresata.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JMcPana Petrusewicza d 2 Jan[uarii]\nz Nieswiża 1750 A[nn]o\nChętne [skreśl.: zawsze?] moie ad usus WMcPana\ndisponendo sposobności, w czym kolwiek\nmnie dalsze Jego zachodzić będą requizy-\ncye wszelkiey pro posse meo nie ubliżę uczyn-\nności, na oświadczenie żem iest cunctorum\nvotorum. etc:"},{"n":14,"pages":"5-6","day":2,"language":"pol","addressee":"Podoski, wojewoda płocki","addressee_src":"Podolski, wojewoda płocki","addressee_status":"as in heading (no AM correction)","heading":"Do JW JMci Pana Podoskiego W[oiewo]dy Płockiego z Nieswiża d 2. Jan[uarii] 1750","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia; rewanż.","certainty":"high","uncertain":1,"hand_change":false,"notes":"Rękopis: „Podoski, wojewoda płocki”; tabela: „Podolski”.","text":"Do JW JMci Pana Podoskiego W[oiewo]dy\nPłockiego z Nieswiża d 2. Jan[uarii] 1750\nW tych instynktach ktore się we mnie\nad optatissima quaeq[ue] WMcPana dy-\nsponowane gromadzą się tym życzliwsze\ndziś żądze in łaskawych Jego apprecacyi\nodbieram tesserami, za co iako nayuniżeń-\nsze moie wyrażam WMcPanu podzięko-\nwanie, tak wzaiemnie serce in vota diffuso [?]\nżycząc animitus ażebyś potenti dextera\nNowonarodzonego Pana przekonawszy quid-\nvis ingruentia fati pomyślnemi ad integram\nsatisfactionem cieszył się successami w nie-\nprzeżyte wieki, pewien będąc o mnie żem\niest immorituro voto."},{"n":15,"pages":"6","day":2,"language":"pol","addressee":"Dębowski, bp kamieniecki","addressee_src":"Dębowski, bp kamieniecki","addressee_status":"as in heading (no AM correction)","heading":"Do JW Jm X[ię]dza Dembowskiego Biskupa Kamienieckiego die 2da Januarij z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":["Kościół (biskupstwo)"],"topics":["Życzenia świąteczne i noworoczne","Religia, Kościół, modlitwa"],"summary":"Podziękowanie za życzenia z okazji Świąt.","certainty":"high","uncertain":0,"hand_change":true,"notes":"","text":"[inna ręka]\nDo JW Jm X[ię]dza Dembowskiego Biskupa Kamienieckiego\ndie 2da Januarij z Nieswiża.\n[na marginesie: +] Dawne moie ad cultus WMWM Pana obligacye, renovas\nwe mnie WMWM Pan votorum suorum expressione z oka-\nzyi Świąt przepędzonych, za ktore nayniższe niosąc po-\ndziękowanie, pari mu apprecatione tak iako naydłuższych\npro fulcro Ecclesiae et Reipub[licae] życzę y zostawam perenna-\nturo cultu &c:"},{"n":16,"pages":"6","day":2,"language":"pol","addressee":"Lubomirski, straźnik w.kor.","addressee_src":"Lubomirski, straźnik w.kor.","addressee_status":"as in heading (no AM correction)","heading":"Do JO Kcia Jm Lubomirskiego Strażnika W Kor[onnego] die 2da Januarij. z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Rewanż życzeń noworocznych.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JO Kcia Jm Lubomirskiego Strażnika W Kor[onnego]\ndie 2da Januarij. z Nieswiża.\nŻyczliwe W X Mci votum do wzaiemney pobudza mię wdzię-\nczności y apprecacyi, za ktore moie uniżone zaniosłszy\ndzięki, też same in mutua resolvendo vota obowiąza-\nnym życzę sercem, aby wszelkie z przepędzonym Rokiem\nprzeszły [skreśl.: nie, poprawione nad wierszem] niepomyślności, a nowe przy renowacyi Roku, w\niak naydłuższe kwitnęły z czerstwością zdrowia czasy\ncoraz większe honory y pomyślne successa in satisfacti-\nonem pragnieniu tego, ktory iest addicta propensione\nvera &c:"},{"n":17,"pages":"6","day":2,"language":"pol","addressee":"Jabłonowski Dymitr Hipolit, starosta kowelski","addressee_src":"Jabłonowski, starosta kowelski","addressee_status":"identified (AM)","heading":"Do JO Kcia Jmci Jabłonowskiego St[aros]ty Kowelskiego die 2da Januarij z Nieswiża","series":"Życzenia noworoczne","persons":["Jabłonowska Józefa z Mycielskich"],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Życzenia dla adresata i jego żony.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JO Kcia Jmci Jabłonowskiego St[aros]ty Kowelskiego\ndie 2da Januarij z Nieswiża\nPrzymnażasz we mnie W X Mc niezliczonych obligacyi\nmultiplici votorum suorum expressione przy Recursie\nŚwiąt teraźnieyszych, y wraz iako mię do należytego\nza nie pociągasz dziękczynienia, tak niemniey y tego\nżyczenia, ażebyś W X Mc z JO Xiężną Jey Mcią nie-\nzamierzone circa plenitudinem iak nayporządańszych\npomyślności pędzili wieki, te są żądze piszącego się\ninextincto amore &c:"},{"n":18,"pages":"6-7","day":2,"language":"pol","addressee":"Sulistrowski, marszałek oszmiański","addressee_src":"Sulistrowski, marszałek oszmiański","addressee_status":"as in heading (no AM correction)","heading":"Do W Jm Pana Sulistrowskiego Marszałka Powiatu Oszmiańskiego die 2da Januarij z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Rewanż życzeń noworocznych.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jm Pana Sulistrowskiego Marszałka Powiatu Oszmiań-\nskiego die 2da Januarij z Nieswiża.\nBardziey nad Malenkiego Jezusa pieluszki życzliwe\nWMWM Pana obstringunt mię vota do wzaiemney Jemu\nna podziękowanie życzliwości, ktorych in satisfactionem\n[skreśl.: …] nowego winszuiąc Roku, życzę aby e fasciis Naro-\ndzonego Boga wszelkie niepomyślności z przemiiaiącym\nsię Rokiem w naypomyślnieysze przemieniły się sukcessy,\nktorych ex corde życząc iestem continuo voto. &c:"},{"n":19,"pages":"7","day":2,"language":"pol","addressee":"Sapieha Jan Fryderyk, kanclerz w.lit.","addressee_src":"Sapieha, kanclerz w.lit.","addressee_status":"identified (AM)","heading":"Do JW Jm Pana Sapiehy Kanclerza W W X Litt [d]ie 2 Janu[arii]","series":"Inne","persons":["Giecewicz Nikodem Ignacy, podstoli wileński","Świdziński Stanisław Antoni, wojewoda bracławski"],"intermediaries":[],"places":[],"institutions":["Poczta mińska"],"topics":["Poczta, przesyłanie listów i wiadomości","Polityka dworska i frakcyjna","Protekcja, rekomendacja, wstawiennictwo","Dobro publiczne, spokój w prowincji"],"summary":"Odpowiedź na wiadomości z poczty; przesłanie kopii listu Świdzińskiego; zgoda na wstawiennictwo za Giecewiczem.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW Jm Pana Sapiehy Kanclerza W W X Litt [d]ie 2 Janu[arii]\nz Nieswiża.\nY z dzisieyszey Poczty z należytą [skreśl.: …] weneracyą od-\nbieram tesseram nieustaiącey dobroci JWWMPana Dobrodzieia,\nz wyrażeniem zachodzących circumstancyi in praesenti re-\nrum statu, o ktorych cokolwiek y u mnie znayduie się\ncuriosi, nieomieszkiwam zawsze communicare iemu, iako\ny teraz adiungo kopią Listu Jm P Swidzinskiego Wdy\nBracławskiego dość ciekawą, iakie z tych koniektur wyni-\nkną skutki, utinam nayporządańsze dla Oyczyzny, przyszły\nchyba czas odkryie, ia zawsze wyglądać będę chwalebnych\npro Publico sentymentow JWWM Pana, y z niemi omnes\n[na marginesie: B] meos łączyć conatus, a iako poważam wielce u siebie\nkażde roskazy JWWM Pana, tak zachodzącey Interpozycyi\nJego za Jm Panem Giecewiczem chętnie adesse nie omieszkam\nieżeli mu będę possibilitate mea mogł w czym usłużyć.\nZostaiąc na wszelkie skinienia. &c"},{"n":20,"pages":"7-8","day":2,"language":"pol","addressee":"Sapieżyna, kanclerzyna w.lit.","addressee_src":"Sapieżyna, kanclerzyna w.lit.","addressee_status":"as in heading (no AM correction)","heading":"Do JO Xiężny Jey Mci Sapieżyney Kanclerzyney W W X Litt die 2da Januarij 1750 Anno z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia świąteczne.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JO Xiężny Jey Mci Sapieżyney Kanclerzyney W W X\nLitt die 2da Januarij 1750 Anno z Nieswiża.\nSą to znaki nieograniczoney serca dobroci JO Waszey Xcey\nMci, żeś mi życzliwe swoie w powinszowaniu Świąt teraźniey-\nszych ogłosiła apprecacye, ktore iako we mnie tym głośniey-\nsze nie tylko do iak nayuniżeńszego mego za nie podziękowa-\nnia, lecz y wzaiemnego życzenia wzruszaią obowiązki, tak\nprawdziwym sprzyiam sercem, ażebys W X Mość za bło-\ngosławieństwem wcielonego Boga w zupełney zdrowia\nczerstwości, niezliczone liczyła y przepędzała wieki na zupełną\nsatysfakcyą piszącego się z nieskończonym respektem &c"},{"n":21,"pages":"8","day":2,"language":"pol","addressee":"Rojkiewicz","addressee_src":"Rojkiewicz","addressee_status":"as in heading (no AM correction)","heading":"Do Jm Pana Roykiewicza d 2 Januarij z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Rewanż życzeń noworocznych.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do Jm Pana Roykiewicza d 2 Januarij z Nieswiża.\nZa vota z dobrego WMWMPana pochodzące serca nieśmierteł-\nną wyrażaiąc wdzięczność, wzaiemnych życzę pomyślności\nwszelkich, aby przy nowo zaczętym Roku wyrokiem nazna-\nczone Boskim wszystkie zastarzałe zaginowszy nieszczęścia,\nw nowe zamieniły się na długie czasy honorow y fortun suk-\ncessy, ktorych corde pragnąc zostaię interminabili voto &c:"},{"n":22,"pages":"8","day":2,"language":"pol","addressee":"Cichocki Andrzej, metrykant","addressee_src":"Cichocki Andrzej, metrykant","addressee_status":"as in heading (no AM correction)","heading":"Do Jm Pana Cichockiego d 2 Janu: z Nieswiża","series":"Inne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Poczta, przesyłanie listów i wiadomości"],"summary":"Podziękowanie za prywatną korespondencję.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do Jm Pana Cichockiego d 2 Janu: z Nieswiża\nPrawdziwey WMWMPana iest to dowod przychilności,\nkiedy partykularną ze mną certuiesz korrespondencyą,\nna ktore uniżone niosąc dzięki, pewien o dalszey iego\nrzetelności na zawsze zostaię &c:"},{"n":23,"pages":"8","day":2,"language":"pol","addressee":"Szwarcenfeldt, obersztlejtnant JKM","addressee_src":"Szwarcenfeldt, obersztlejtnant JKM","addressee_status":"as in heading (no AM correction)","heading":"Do JmcPana Swarcenfeldta [?] Obersztleytnanta JKMci d 2da Januarij z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":["Wojsko WXL"],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia i rewanż.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do JmcPana Swarcenfeldta [?] Obersztleytnanta JKMci\nd 2da Januarij z Nieswiża.\n[na marginesie: +] Wyrażone mnie circa revolutionem Świąt przechodzących\ny nowo zaczynaiącego się Nowego Roku apprekacye WMW-\nMPana grato przyimuię pectore, do należytego Jemu znam\nsię podziękowania, oraz wzaiemnie niezliczonych WMWM\nPanu ad satisfactionem votorum, życząc pomyślności zo-\nstawam indesinenter &c:"},{"n":24,"pages":"8","day":2,"language":"pol","addressee":"Kahlen, pocztmajster","addressee_src":"Kahlen, pocztmajster","addressee_status":"as in heading (no AM correction)","heading":"Do Jm P Kahlena Pocztmaystra z Nieswiża d 2 Jan:","series":"Inne","persons":[],"intermediaries":[],"places":["Mińsk"],"institutions":["Poczta mińska","Skarb Radziwiłłowski"],"topics":["Poczta, przesyłanie listów i wiadomości","Płatności, długi, zaległości"],"summary":"Utrzymanie nowego kursu poczty mińskiej; asygnacje na raty marcową i wrześniową.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do Jm P Kahlena Pocztmaystra z Nieswiża d 2 Jan:\nKurs nowy Poczty Minskiey [nad wierszem: aby] nie był przerwany w dalszym\nczasie, assygnacye na Raty przyszłe Marcową y Septem-\nbrową odeszlę WMWMPanu, teraz zaś o iednostayną\nmnie quorumq[ue] occurrentium kommunikacyą convenien-\ndo, zostawam constanter &c."},{"n":25,"pages":"8-9","day":2,"language":"pol","addressee":"Świdziński Stanisław Antoni, wojewoda bracławski","addressee_src":"Świdziński, wojewoda bracławski","addressee_status":"identified (AM, matched by surname and office)","heading":"Do JW Jm Pana Swidzinskiego Wdy Bracławskiego d 2 Januarij z Nieswiża.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Podziękowanie za życzenia.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW Jm Pana Swidzinskiego Wdy Bracławskiego\nd 2 Januarij z Nieswiża.\nPrzydaiesz mi WMPan pondus ponderi trwaiących we\nmnie nieskończenie uprzeymości łaskawym votorum suorum\nad Recursum Świąt teraźnieyszych oświadczeniem się, a tym\nbardziey iako do nieskończonego za nie podziękowania, tak\nnie mniey ad reciproca pobudzasz vota, et apprecationes,\nażebyś zwyciężywszy fatorum sprzysiężenia, victricia z nich\nsigna canes w iak nayporządańszych pomyślnościach y zdro-\nwia czerstwości niepoalterowanego, czego cordicitus pra-\ngnąc, piszę się non desituro cultu &c:"},{"n":26,"pages":"9","day":1,"language":"fr","addressee":"Turenne, książę","addressee_src":"Turenne, książę","addressee_status":"as in heading (no AM correction)","heading":"a S.A. Mgneur le Prince de Turenne le 1 Janvier 1750","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Życzenia noworoczne dla księcia de Turenne (fr.).","certainty":"high","uncertain":0,"hand_change":true,"notes":"","text":"[inna ręka]\na S.A. Mgneur le Prince de Turenne le 1 Janvier 1750\na Niesvisz\nIl m'est impossible de retenir la joye, que je ressens d'avoir\nrencontré dans le renouvellement de l'année, une grande car-\nriere à l'explication des sentiments de la plus tendre amitié\nque j'ai vouée a Votre Altesse. A mon avis, je ne sçaurois le\nmieux mettre en tout leur jour, qu'en lui presentant les\nvoeux tres-sinceres, que je fais pour la reussite de toutes\nses entreprises dignes de la grandeur d'ame, et pour le main-\ntien de sa santé aussi long tems qu'on peut le souhaitter.\nagréez Mgr je vous prie ces marques de mon affection, avec\nlaquelle j'ai l'honneur d'etre."},{"n":27,"pages":"9","day":1,"language":"fr","addressee":"Louise Henriette Gabrielle de Lorraine, ks. de Turenne","addressee_src":"Turenne, księżniczka, ur princesse de lorraine","addressee_status":"identified (AM)","heading":"a S.A. Madame la Princesse de Turenne née Princesse de Lorraine le 1 Janvier 1750 Niesviz","series":"Życzenia noworoczne","persons":["Ludzie interesów Rybeńki (oficjaliści)"],"intermediaries":[],"places":[],"institutions":["Skarb Radziwiłłowski"],"topics":["Życzenia świąteczne i noworoczne","Płatności, długi, zaległości"],"summary":"Przeprosiny za zaległe odsetki; polecenie wypłaty; życzenia (fr.).","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"a S.A. Madame la Princesse de Turenne née Princesse\nde Lorraine le 1 Janvier 1750 Niesviz\nC'est à bon droit, que Votre Altesse se plaint de mes gens\nd'affaires sur le terme du payement de ses arrerages, echû\nplutot par leur inattention, que par ma faute. Choqué au\nvif de leur negligence dans une chose, qui ne souffre point\nde delai, je viens de leur donner les ordres les plus precis, en\nconformité desquelles ils seront obligés de lui remettre les in-\nterêts retenus par le passé, et d'apporter à l'avenir une exa-\nctitude sur ce point-la, qui se rende garant de ma droiture.\nJugez par là Madame, de la precaution, que je prens, pour\nne donner aucune atteinte à votre amitié, dont je me flatte\nde faire grand cas. Vous pouvez en etre encor plainement\nconvaincüe par les voeux, que j'ai l'honneur de vous presenter\nà l'occasion du renouvellement de l'année, suppliant le Tout puis-\nsant de conserver aussi long-tems que me souhait s'etendront\nvotre precieuse santé et de faire prosperer tous vos desseins\na votre satisfaction. Je finis ces demonstrations de ma bonne volon-\nté par les assurances de l'attachement le plus sincere, avec lequel\nj'ai l'honneur d'etre."},{"n":28,"pages":"10","day":1,"language":"fr","addressee":"Maria Ludwika de La Tour d’Auvergne, ks. de Rohan","addressee_src":"de la Tour d'Auvergne, księżniczka nee Rohan","addressee_status":"identified (AM)","heading":"a S.A. Madame la Princesse de la Tour d'Auvergne née Princesse de Rohan le 1 Janvier 1750 Niesviz.","series":"Życzenia noworoczne","persons":["Bacquier [?]","Pełnomocnik adresatki","Potocki, hrabia"],"intermediaries":["Potocki, hrabia"],"places":[],"institutions":["Skarb Radziwiłłowski"],"topics":["Życzenia świąteczne i noworoczne","Płatności, długi, zaległości","Poczta, przesyłanie listów i wiadomości"],"summary":"Suma wg konwencji gotowa do odbioru przez pełnomocnika; list doręczony przez hr. Potockiego (fr.).","certainty":"medium","uncertain":1,"hand_change":false,"notes":"","text":"a S.A. Madame la Princesse de la Tour d'Auvergne née Princesse\nde Rohan le 1 Janvier 1750 Niesviz.\nLa lettre de V.A. dont elle a bien voulu charger Mr le Comte de Potocki\nme donne un sujet réel d'en etre satisfait d'autant plus, que j'y\ntrouve les sentiments de l'amitié la plus epurée, dont Votre\nAltesse s'est fait plaisir de m'honorer. Il est de mon devoir\nqu'à son exemple je n'omette rien de tout ce qui peut servir\nà tenir dans un juste contre-poids les assurances de l'affection\nreciproque que j'ai l'avantage de lui presenter au renouvel-\nlement de l'année, où nous allons entrer. Il est aisé a V.A.\nde concevoir, quel est le caractere de mes voeux, que je fais\nà cette occasion, pour la conservation de son Illustre Personne\net l'accomplissement de ses justes desirs, si elle veut bien con-\nsiderer le fond de mon coeur tres-sincere, d'ou les souhaits de\ncette nature tire leur origine. Enfin pour ne lui laisser rien à\ndesirer de mon coté, j'ai l'honneur de lui declarer par celle\nci d'une maniere la plus positive, que la somme exigée par\nV.A. sur le pié de la convention faite avec Mr de Bacquier [?]\nest deja prete, ensorte qu'il ne depend que d'elle de la faire\nlever par son Plenipotentiaire moyennant une quittance re-\nquise à ce sujet. Il est à croire, que ma droiture et ponctuali-\nté en fait du remboursement, dont il s'agit, donnera une face\navantageuse au devouement inviolable, avec lequel j'ai l'honneur\nd'etre."},{"n":29,"pages":"10","day":1,"language":"fr","addressee":"Vincenti Etienne Auguste, jałmużnik króla i kanonik warszawski","addressee_src":"Vincenty, abbe","addressee_status":"identified (AM)","heading":"a Mr Vincenti. Le 1 Janvier 1750. Niesviz","series":"Życzenia noworoczne","persons":["Senatorowie (grupa)"],"intermediaries":[],"places":["Warszawa"],"institutions":["Senat"],"topics":["Życzenia świąteczne i noworoczne","Polityka dworska i frakcyjna","Dyplomacja i sprawy zagraniczne"],"summary":"Rewanż życzeń; oczekiwanie na wynik negocjacji senatorów w Warszawie i zawarcie pokoju (fr.).","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"a Mr Vincenti. Le 1 Janvier 1750. Niesviz\nA proportion que vous avez reiterez en ma faveur les comple-\nments de congratulation, joints aux souhaits cordials, occasio-\nnés par le renouvellement de l'année, comme vos lettres, l'une\ndu 13 et l'autre du 27 Decembre le font voir, je repete aussi\nles actions des graces, que je vous en rends, et les voeux, que\nje fais reciproquement pour tout ce qui tend à votre conten-\ntement. J'attends avec impatience l'evenement de tous ces\nmouvemens, que quelques uns de nos Senateurs se donnent\npour remettre l'Etat de notre Republique sur un bon\npié. Il est à souhaitter, que la ville de Varsovie devenüe\nà present le Theatre de toutes les negotiations, le soit\naussi de la conclusion de la Paix si long-tems regrettée.\nEtant dans l'attente d'une nouvelle de cette façon, je vous\nfais les assurances de la plus parfaite amitié avec laquelle\nje suis"},{"n":30,"pages":"10-11","day":1,"language":"fr","addressee":"Horguelin","addressee_src":"Horgueglin","addressee_status":"identified (AM)","heading":"a Mr Horguelin. Le 1 Janvier 1750 Niesviz","series":"Życzenia noworoczne","persons":["NN, agent Rybeńki w Warszawie"],"intermediaries":[],"places":["Francja","Warszawa"],"institutions":[],"topics":["Poczta, przesyłanie listów i wiadomości","Płatności, długi, zaległości","Życzenia świąteczne i noworoczne"],"summary":"Przekazanie czterech listów do Francji; opłata pocztowa wypłacona przez agenta w Warszawie (fr.).","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"a Mr Horguelin. Le 1 Janvier 1750 Niesviz\nJe vous suis bien redevable de l'avantage, que j'ai de recevoir\npar votre moyen une incluse accompagnée de votre Lettre.\nL'exactitude, que vous avez cy devant gardée dans des pareilles\noccurances, me fait esperer, que vous ne cesserez de me continuer\nà l'avenir vos bons offices de la meme nature. C'est en considera-\ntion de cela, que je prens le parti de remettre entre vos mains\nquatre lettres à expedier en France, vous assurant, que le port\nexigé à ce sujet, dont vous faites monter le prix à 6 Ducats\n11 Tyf[?], vous sera payé par mon agent de Varsovie. Les\nvoeux, que vous faites à l'occasion du renouvellement de l'année\npour la conservation de mes jours me sont si aggreables, que\nje ne laisse pas de vous repondre par des souhaits semblables\nà ceux, que vous m'avez presentez. J'y ajoute encor les assu-\nrances de mon affection avec laquelle je suis."},{"n":31,"pages":"11","day":1,"language":"fr","addressee":"Bouillon, książę","addressee_src":"Bouillon, książę","addressee_status":"as in heading (no AM correction)","heading":"a S.A. Mgneur le Duc de Bouillon. le 1 Janvier 1750.","series":"Życzenia noworoczne","persons":[],"intermediaries":[],"places":[],"institutions":[],"topics":["Życzenia świąteczne i noworoczne"],"summary":"Życzenia noworoczne dla księcia de Bouillon (fr.).","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"a S.A. Mgneur le Duc de Bouillon. le 1 Janvier 1750.\nComme la santé de V.A. est au dessus de tout le prix, soit\nqu'on la regarde du coté du bonheur, qui en resulte sur toute\nsa Famille Ducale, soit qu'on se reflechit sur une grande\nsatisfaction, que ses amis en retirent, je ne sçaurois lui pre-\nsenter à l'occasion du renouvellement de l'année une sacrifice\nplus aggreable, que celui des voeux, que je fais et continuerai de\nfaire pour la conservation de sa Personne tres distinguée, et\nl'aggrandissement de son Nom jusqu'à ce degré de Gloire, ou\ntout l'Univers avoit vu briller ses ancetres admirés de\ntoute la posterité. Je vous supplie Mgr de vouloir bien agréer\net accepter ces souhaits comme autant de preuves du devouement\nrespectueux, avec lequel j'ai l'honneur d'etre."},{"n":32,"pages":"11-13","day":3,"language":"pol","addressee":"Sedlnicki Karol Józef, podskarbi w.kor.","addressee_src":"Siedlnicki, podskarbi kor.","addressee_status":"identified (AM)","heading":"Do JW Jmc Pana Siedlnickiego Podskarbiego Wiel[kiego] Koron[nego] d 3tia Januarij 1750 Anno z Nieswiża.","series":"Życzenia noworoczne","persons":["Potocki Józef, kasztelan krakowski","Oddawca listu","Sedlnicka Konstancja z Branickich"],"intermediaries":["Oddawca listu"],"places":["Józefów","Piotrków","Wilno"],"institutions":["Trybunał Główny WXL","Senat","Dwór królewski"],"topics":["Życzenia świąteczne i noworoczne","Polityka dworska i frakcyjna","Trybunał Główny Litewski","Dobro publiczne, spokój w prowincji","Odesłanie do ustnej relacji posłańca"],"summary":"Odmowa podpisania listu-ekspedycji do tronu z obawy przed oskarżeniem o spisek przed Trybunałem wileńskim; deklaracja jedności dla dobra publicznego.","certainty":"medium","uncertain":6,"hand_change":false,"notes":"","text":"Do JW Jmc Pana Siedlnickiego Podskarbiego Wiel[kiego] Koron[nego]\nd 3tia Januarij 1750 Anno z Nieswiża.\nDwoiaki mam zysk w szczęściu moim, bo lubo iuż miałem\nhonor powinszowania WMWM Panu Świąt niedawno przeszłych,\nprzychodzi mi znowu przy uniżonym podziękowaniu za\nwyrażone od niego kongratulacye, ingeminare vota\nz prawdziwym życzeniem, aby Rok nowo zaczęty codzien-\nne nowych y pożądanych pomyślności przynosił onemu\nskutku, chowaiąc WMWM Pana circa integritatem pu-\nblicae saluti potrzebnego zdrowia diuturnum et a fati\nlonge remotum: A iako niewątpliwy zawsze iestem\ny byłem myśli, że JO Jmci Pana Kasztellana Krakowskiego [?]\nMWPana w trwałych y nieporuszonych dla Dobra publicznego\nkażdy może widzieć sentymentach tak kiedy y sam WMWMPan\ndoświadczyłeś pod bytność swoią w Jozefowie, verum et inve-\nteratum w nim Patriae amorem przez odrzucenie wszystkich\npowabow w ofiarowanych godnościach y urzędach, wiem, że\nclarius poznałeś zbawienne pro publico Intencye Jego, do\nktorych kiedy każdego z nas miłość powinna pociągać\nOyczyzny, znayduię mię nie w innych w całym wieku mo-\nim zostaiącego dyspozycyach, ale w każdym razie a tym\nbardziey in recenti casu publicznego upadku unita virtus for-\ntiora może dać iuvamina, tak upewniam, że nierozerwaney\nWMWMPana [nad wierszem: moiey ?] przyiaźni, y, y iednego rozumienia dla utrzymania\npubliczney szczęśliwości, być pragnę, y iawnych tego dawać\nnieomieszkiwam dowodow, niech to iednak sinistras opinio-\nnes o mocnym moim w tym niedyspozycyi [?] przedsięwzięciu, że mu-\nszę być excusabilis od podpisania przysłaney mi ad maiestatem\nexpedycyi, ex ratione praecipua et considerabili następuiącego\nu nas Trybunału, na ktory gotuią się malevoli animi, aby\nmogli widzieć [skreśl.: uszczęśliwioną Prowincyą] [nad wierszem: effigiem et similitudinem] Piotrkowskiego,\nże zaś hanc deformitatem odwrocić pragnę y w swoiey ozdo-\nbie widzieć uszczęśliwioną Prowincyą, gdybym się podpi-\nsał do tego Listu, a potym by ad exemplum Piotrkowskiey\ntranzakcyi wykonali swoie imprezy w Wilnie, mogli by\npewnie wszystko zwalić na mnie, remonstruiąc iako zwykli\nDworowi y głosząc wszędzie że iuż to dawney miałem\nin praemeditationibus u siebie, kiedym się przyłączył pod-\npisem moim do przysłanego mi Listu, satius tedy uti\nmora y mieć mię pro ulteriori eventu pewnego y nieodmien-\nnego pro publico bono Interessanta, ile kiedy widząc mię\nadversi zawsze bene sentientem, y nietylko powszechney\nspokoyności, ktorey dotąd naruszyć nie potrafili pilnuią-\ncego, iescze się przezieraią w myślach y radach swoich\n[na lewym marginesie pionowo, inną ręką:] M[…]at [?] alias list przysłany reperitur in miscellaneis folio 4.\nniemogąc prawdziwych zawsze dla Oyczyzny pożądać opacz-\nnie krokow moich, a tak przez ten podpis mogliby rozmaicie\nwykładać rectas intentiones meas, że wszystkich iednak okoliczno-\nści gdy uważam, życzyłbym totaliter niepodpisać tego listu,\nktory może sapere modum conventiculi przez wyraźne prawa\nprohibiti, a wszakże każdy Senator z powinnych obowiązkow\niest in iure et potestate legitima dopominienia się krzywdy pu-\nbliczney y praw naruszenia, y może to uczynić [korsiva?]\nremonstratione ad Thronum, a nie w iednym Liście, ktory mogą\nmalevoli interpretatores za spisek iaki przed Nayiaśnieyszym\nudać Panem, Lubię [?] to ponderosioribus sensibus WMPana,\nia zaś spondeo za siebie, że chociaż dla wyrażonych oko-\nliczności, o ktorych prolixius spowie oddawca Listu, nie\npodpisuię przysłaney expedycyi, nie odpiszę się iednak ni-\ngdy od zbawiennych dla Oyczyzny y powszechnego szczęścia\nRad y myśli onych, y owszem pragnę mieć nieustanną\nkommunikacyą wszystkich hoc in passu intencyi onych,\nżebym mogł zawsze one prawdziwą moią tego [?] usilno-\nści y pokazać [?], żem iest w iednomyślnych sentymentach &c\nP.S. Jey Mci Pani Podskarbiney iako nayniżeńszy kłaniam\nza pamięć dziękuię, a iak kochaiącey Cousin życzę przy\ntym nowym Roku, Toute sorte de prosperité &c:"},{"n":33,"pages":"13","day":3,"language":"pol","addressee":"Baranowicz Kazimierz, strażnik polny lit.","addressee_src":"Baranowicz, straźnik polny lit.","addressee_status":"identified (AM)","heading":"Do JmP Baranowicza Strażnika Polnego W X L z Nieswiża d 3 Ja[nuarii]","series":"Inne","persons":["Mokrzecki Antoni Kazimierz, koniuszy lidzki [?]"],"intermediaries":[],"places":["Lida"],"institutions":["Sejmik gromniczny (deputacki)","Wojsko WXL"],"topics":["Wezwanie do przyjazdu, konferencja","Sejmiki (gromniczne, deputackie)"],"summary":"Prośba o szybki przyjazd z Mokrzeckim przed sejmikami gromnicznymi.","certainty":"high","uncertain":0,"hand_change":true,"notes":"","text":"[inna ręka, drobniejsze pismo]\nDo JmP Baranowicza Strażnika Polnego W X L z Nieswiża d 3 Ja[nuarii]\nIako zawsze dla siebie znam dobre WMWMP serce, tak y teraz ufno-\nści nieomylney enixe iego convenio ażebys swoiey nie żałuiąc fatygi z\nJmP Mokrzeckim Porucznikiem Lidzkim Towarzyszem Znaku W-\nMP przed Seymikami Gromnicznemi quam citissime tu do mnie\nchciał ziachać, a iako tę uczynność omni studio zawdzięczyć cona-\nbor tak in hac sponsione et expectatione prętkiego pośpiechu zosta-\nię ad quaeq[ue] vota &c:"},{"n":34,"pages":"13-14","day":3,"language":"pol","addressee":"Sołłohub Antoni Józef, generał artylerii lit.","addressee_src":"Sołłohub, generał artylerii lit.","addressee_status":"identified (AM)","heading":"Do JP Sołłohuba Generała Artyllerii W X L z Nieswiża d 3 Januarij","series":"Inne","persons":["Zeyfert, porucznik garnizonów ordynackich","Zeyfert, syn porucznika"],"intermediaries":[],"places":["Remizów [?]"],"institutions":["Artyleria WXL","Garnizon ordynacki (nieświeski)"],"topics":["Wojsko, artyleria, nominacje wojskowe","Protekcja, rekomendacja, wstawiennictwo","Płatności, długi, zaległości"],"summary":"Wstawiennictwo za zwrotem kosztów Zeyferta i za stopniem kapitana artylerii dla jego syna.","certainty":"medium","uncertain":3,"hand_change":false,"notes":"","text":"Do JP Sołłohuba Generała Artyllerii W X L z Nieswiża d 3 Januarij\nLubo pewien iest JP Zeyfert Porucznik Garnizonow moich Ordynackich\nsummae aequanimitatis WMP że cokolwiek na reparacyą Cekhauzu, Me-\nlioracyą Folwarku Remizowskiego [?] y sporządzenie laboratorij własnego\nswego iak sam refert łożył kosztu w tym wszystkim iustam satisfa-\nctionem uczynić mu WMP rozkażesz, atoli iednak iterum [?] in sub-\nsidium y moiey do WMWMP wzywa interpozycyi ktorą zano-\nsząc wraz z tęż [?] ad vota tegoż JP Porucznika za Synem\niego młodszym iako do Architektury y artyllerij capacita-\ntem maiącym instancyą moię ażebys go w Woysku\nartyllerij W X L przy szarży Kapitańskiey z Porucz-\nnikowskim traktamentem lokować raczył, o co recen-\nsendo vota mea zostawam sam interminabili pro-\npensione &c"},{"n":35,"pages":"14","day":3,"language":"pol","addressee":"Ogiński Ignacy, marszałek nadworny lit.","addressee_src":"Ogiński, marszałek nadworny lit.","addressee_status":"identified (AM)","heading":"Do JmPana Ogińskiego Marszałka Nadwornego W X L z Nieswiża d 3 Jan[uarii] 1749 [sic] Anno","series":"Inne","persons":["Ogińska Helena z Ogińskich","Radziwiłłowa Franciszka Urszula z Wiśniowieckich"],"intermediaries":[],"places":["Nieśwież"],"institutions":[],"topics":["Wezwanie do przyjazdu, konferencja","Polityka dworska i frakcyjna"],"summary":"Prośba o rychły przyjazd do Nieświeża dla omówienia pilnych spraw publicznych, których nie można powierzyć papierowi.","certainty":"medium","uncertain":0,"hand_change":false,"notes":"Data w rękopisie: 1749 [sic], w ciągu listów z 3 I 1750.","text":"Do JmPana Ogińskiego Marszałka Nadwornego\nW X L z Nieswiża d 3 Jan[uarii] 1749 [sic] Anno\nNietylko ex insuperabili desiderio personalnego\nuściskania WMWMPana, lecz też ob publica et\nurgentia negotia ktorych trudno papierowi po-\nwierzać iak nayuniżeniey upraszam abyś raczył\nmi WMWMPan darować prętką bytnością swo-\nią tu w Nieswiżu o co iteratis upraszaiąc vo-\ntis supprimo calamum zachowuiąc wszyst-\nko do ustney konferencyi przy ktorey y to\nwyznam żem iest addictissimo corde.\nŻona moia oboygu WMWM Państwu kłania\nuniżenie ja zaś Helenki Dobrodzieiki sto-\npy całuię."},{"n":36,"pages":"14-15","day":3,"language":"pol","addressee":"Żabina Marianna z Pakoszów, starościna starodubowska wdowa (1. voto Kazimierzowa Józefowa Chalecka starościna rzeczycka)","addressee_src":"Żabina, starościna starodubowska","addressee_status":"identified (AM)","heading":"Do W Jey Mci Żabiney Starościney Starodubowskiey d 3tia Januarij. z Nieswiża.","series":"Inne","persons":["Chalecki Antoni, podkomorzy rzeczycki"],"intermediaries":[],"places":["Mińsk"],"institutions":["Trybunał Główny WXL"],"topics":["Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Przesłanie kopii suplikii do Trybunału w sprawie z Chaleckim; rada, by adresatka podała ją osobiście w Mińsku.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jey Mci Żabiney Starościney Starodubow-\nskiey d 3tia Januarij. z Nieswiża.\nJako do nayprętszego y day Boże iak naylepszego suk-\ncessu sprawy WMWMPani z Jm Panem Podkomorzym\nRzeczyckim zachodzącey, usilnego przykładam starania,\ntak na ten koniec ułożoną kopią suppliki do Trybuna-\nłu Gl[ownego] W. X. Litt. posyłam WMWMPani, życząc Jey, aże-\nbyś sama do Minska ziachawszy supplikę pomienioną\nsądowi podała, wierząc iż krok takowy nietylko sa-\ndowi [nad wierszem: większą uczyni impressyą], ale też y stronę przeciwną pociągnie do pręt-\nszey y łatwieyszey kombinacyi, a ia upewniam,\nżem iest z nieskończonym respektem &c:"},{"n":37,"pages":"15","day":3,"language":"pol","addressee":"Ogiński Tadeusz Franciszek, kasztelan trocki","addressee_src":"Ogińsk, kasztelan trocki","addressee_status":"identified (AM)","heading":"Do JW Jm Pana Ogińskiego Kasztellana Trockiego d 3 Januarij z Nieswiża.","series":"Życzenia noworoczne","persons":["Hałko Szaława Florian Antoni, stolnik smoleński","Ogińska Izabela z Radziwiłłów"],"intermediaries":[],"places":[],"institutions":["Sejmik gromniczny (deputacki)"],"topics":["Sejmiki (gromniczne, deputackie)","Protekcja, rekomendacja, wstawiennictwo","Życzenia świąteczne i noworoczne"],"summary":"Poparcie dyspozycji adresata co do sejmików deputackich; przyjęcie wstawiennictwa za Hałką; życzenia.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW Jm Pana Ogińskiego Kasztellana Trockiego\nd 3 Januarij z Nieswiża.\nJako znam, że wszystkie swoie Intencye zwykłeś WMWM\nPan ad ea quae sunt Publici dirigere boni, tak cokolwiek\nWMWMPan zbawiennych uczynisz dyspozycyi intuitu\nSeymikow Deputackich przypadnę chętnie do wszystkiego\nktorego interpozycyą za Jm Panem Hałką Stolnikiem\nSmoleńskim tenerrime amplector, a teraz ex circumstan-\ntia Świąt przeszłych recenter y nowo nastąpionego Ro-\nku excurro na powinszowanie ex animo życząc, ażebyś\nsetne po nim w czerstwym y niepoalterowanym zdro-\nwiu wespoł z Xiężną Jeymcią ktorey przy nayniższym\nukłonie też fundo vota pędził lata, te są prawdziwe\nżądze piszącego się ad quaeq[ue] obsequia &c:"},{"n":38,"pages":"15","day":3,"language":"pol","addressee":"Igelström, second-obersztlejtnant artylerii WXL","addressee_src":"Igielstroma, second obersztlejtnant artylerii lit.","addressee_status":"as in heading (no AM correction)","heading":"Do JPa Igelsztroma Second Obersztersleytnanta [?] artylerij W X Litt die 3 Januarij 1750 z Nieswiża","series":"Inne","persons":[],"intermediaries":[],"places":[],"institutions":["Artyleria WXL","Dwór królewski"],"topics":["Wojsko, artyleria, nominacje wojskowe","Urzędy i nominacje cywilne"],"summary":"Wysłanie patentu na second-obersztlejtnanta artylerii do czasu przywileju królewskiego.","certainty":"medium","uncertain":5,"hand_change":false,"notes":"Rękopis: „Igelsztrom”; tabela: „Igielstroma”.","text":"Do JPa Igelsztroma Second Obersztersleytnanta [?]\nartylerij W X Litt die 3 Januarij 1750 z Nieswiża\nSą u mnie w czułey pamięci [?] y należytey rekognicyi zasługi\nWMWM Pana w Woysku W X Litt, in praemium ktorych\ninterim nim się postaram dla niego o Krolewski przy-\nwiley, posyłam [?] teraz Patent na Second Obersztersleytnanctwo\nw Artylerij W X Litt, sam zostaiąc od gwoli [?] kontentowani [?] [lub nieczytelne]\n[…]"},{"n":39,"pages":"15","day":3,"language":"pol","addressee":"Łopott-Bykowski Józef, starosta bobrujski","addressee_src":"Łopott, starosta bobrujski","addressee_status":"identified (AM)","heading":"Do W Jm Pana Łopota Starosty Bobruyskiego d 3 Janua[rii] z Nieswiża","series":"Inne","persons":["Żabina Marianna z Pakoszów, starościna starodubowska wdowa (1. voto Kazimierzowa Józefowa Chalecka starościna rzeczycka)"],"intermediaries":[],"places":[],"institutions":[],"topics":["Spory sądowe i arbitraż","Odesłanie do ustnej relacji posłańca"],"summary":"Prośba o szybkie wykonanie zleceń w sprawie Żabiny.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jm Pana Łopota Starosty Bobruyskiego d 3 Janua[rii] z Nieswiża\n[duży inicjał] Cokolwiek pod bytność WMWMPana u mnie ustney Jego po-\nleciłem remonstracyi in negotio W Jm Pani Starościney Staro-\ndubowskiey WMWMPani, abyś chciał to iak nayprędzey efficere\ny moie prawdziwe otworzyć w tym pro meliori teyże samey\nbono sentymenta, iako o to upraszam tak oczekiwaiąc\nna rzetelną ad haec praemissa rezolucyą iestem te-\nnerrimo voto. &c:"},{"n":40,"pages":"16","day":3,"language":"pol","addressee":"Żabina Marianna z Pakoszów, starościna starodubowska wdowa (1. voto Kazimierzowa Józefowa Chalecka starościna rzeczycka)","addressee_src":"Żabina, starościna starodubowska","addressee_status":"identified (AM)","heading":"Do W Jm Pani Żabiney Starościney Starodubowskiey d 3 Januarij 1750 z Nieswiża.","series":"Inne","persons":["Łopott-Bykowski Józef, starosta bobrujski"],"intermediaries":["Łopott-Bykowski Józef, starosta bobrujski"],"places":[],"institutions":[],"topics":["Spory sądowe i arbitraż","Odesłanie do ustnej relacji posłańca"],"summary":"Odesłanie do ustnej relacji Łopotta w interesie adresatki.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W Jm Pani Żabiney Starościney Starodubowskiey\nd 3 Januarij 1750 z Nieswiża.\nDla zupełnieyszey y dostatecznieyszey explikacyi Interessu\nściągaiącego się do WMWMPani ustney Jm Pana Staro-\nsty Bobruyskiego MWMPana wszystko poleciłem remonstracyi,\nniewątpliwey będąc nadziei, że te moie z prawdziwego serca\npochodzące perswazye wdzięcznie y chętnie akceptować ra-\nczysz, wierząc temu żem iest w nieustaiących do usłuże-\nnia obowiązkach &c &c:"},{"n":41,"pages":"16","day":4,"language":"pol","addressee":"Sapieha Karol Józef, wojewoda brzeskolitewski","addressee_src":"Sapieha, wojewoda brzeski","addressee_status":"identified (AM)","heading":"Do JW Jm Pana Sapiehy Woiewody Brzeskiego d 4ta Januarij 1750 Anno z Nieswiża.","series":"Inne","persons":["Buchowiecki, porucznik petyhorski","Deputaci brzescy (grupa)","Sapieha Jan Fryderyk, kanclerz w.lit."],"intermediaries":["Buchowiecki, porucznik petyhorski"],"places":["województwo brzeskie"],"institutions":["Sejmik gromniczny (deputacki)","Wojsko WXL"],"topics":["Sejmiki (gromniczne, deputackie)","Odesłanie do ustnej relacji posłańca","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Prośba, by wojewoda osobiście poprowadził sejmik gromniczny brzeski; odesłanie do relacji Buchowieckiego.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JW Jm Pana Sapiehy Woiewody Brzeskiego\nd 4ta Januarij 1750 Anno z Nieswiża.\nPrzybywszy tu do mnie Jm P Buchowiecki Porucznik\nPetyhorski Znaku JW Jm P Kanclerza W W X Litt, doniosł\nmi y opowiedział firmas intentiones WMWMPana, że na nastę-\npuiący Seymik Gromniczny Wdztwa Brzeskiego sam conde-\nscendere infallibiliter zechcesz, iako tedy cokolwiek miałem\nin voto wszystko to ustney tegoż Jm P Porucznika poleciłem\nremonstracyi, na ktorego zupełnie się referuię, tak zostawa\nmi tylko enixe upraszać WMWMPana, ażebyś powziąw-\nszy na siebie opus manutentionis Seymiku tego, wszystkie\ntak swoie łożył conatus, aby nietylko publico desiderio,\nlecz niemniey et gloriae cedat [nad wierszem: samego] WMWMPana y Brzeskie-\ngo Wdztwa, a dla mnie będzie non postrema sors\nobranym Ichmciom PP Deputatom powinszować hono-\nru tego, y ich łaskawym ku sobie gloriari sercem\npiszącemu się in particulari interminabili voto samego"},{"n":42,"pages":"16-17","day":4,"language":"pol","addressee":"Wizgierd, starosta kuszelewski","addressee_src":"Wizgierd, starosty kuszelewski","addressee_status":"as in heading (no AM correction)","heading":"Do JPa Wizgierda Starosty Kuszelewskiego die 4 Januarij 1750 w Nieswiżu","series":"Inne","persons":["Goście przywożący papiery","Radziwiłł Marcin Mikołaj, krajczy w.lit."],"intermediaries":[],"places":[],"institutions":[],"topics":["Wezwanie do przyjazdu, konferencja","Poczta, przesyłanie listów i wiadomości"],"summary":"Pilne wezwanie na rano dnia następnego w sprawie papierów krajczego.","certainty":"medium","uncertain":2,"hand_change":false,"notes":"","text":"Do JPa Wizgierda Starosty Kuszelewskiego die 4\nJanuarij 1750 w Nieswiżu\nPragnąc indispensabiliter pożądanego WMWMPana\ndo mnie przybycia iako pilny do niego interes maiąc\niego enixe et instantissime upraszam, ażebyś summo\nmane dnia iutrzeyszego chciał z łaski swoiey do\nmnie condescendere, gdybyś mogł iescze zastać\nprzysłanych tu u mnie Gości przywożących [?] [skreśl.: …] z Lo-\nba [?] papiery JOKcia Jmci Krayczego W X Litt. A-\nvidissime tedy oczekiwaiąc prętkiego WMPana\ndo mnie pośpiechu zostaię sam w nieustaiących\nobowiązkach"},{"n":43,"pages":"17","day":4,"language":"pol","addressee":"Wereszczaka, gubernator żółkiewski","addressee_src":"Wereszczaka, gubernator żółkiewski","addressee_status":"as in heading (no AM correction)","heading":"Do JmP Wereszczaki Gubernatora Żołkiew[skiego]","series":"Inne","persons":["Buchowiecki, porucznik petyhorski","Sapieha Jan Fryderyk, kanclerz w.lit."],"intermediaries":["Buchowiecki, porucznik petyhorski"],"places":[],"institutions":["Wojsko WXL"],"topics":["Odesłanie do ustnej relacji posłańca","Dobro publiczne, spokój w prowincji"],"summary":"Potwierdzenie odbioru ekspedycji przez Buchowieckiego; życzenia powodzenia.","certainty":"high","uncertain":0,"hand_change":false,"notes":"Brak daty w nagłówku; dzień przyjęty za tabelą.","text":"Do JmP Wereszczaki Gubernatora Żołkiew[skiego]\nOdebrałem expedycyą WMP przez JmPa Buchowieckiego\nPorucznika Petyhorskiego znaku JW JmP Kanclerza W X L\nw ktorey cokolwiek wyczytałem chwalebnych pro publi-\nco obsequio intencyi iego wszystko to wdzięcznym acceptan-\ndo sercem życzę animitus ażeby mu na tamtym mieyscu\niak naypomyślnieyszy in votis iego nastąpił sukcess ad\neffectum ktorego starać się WMP będziesz iunctim z\nJmPm Porucznikiem łożyć conatus swoie et studia, o mnie\nwierząc żem iest na zawsze &c:"},{"n":44,"pages":"17","day":4,"language":"pol","addressee":"Lenkiewicz, starosta grabowski","addressee_src":"Lenkiewicz, starosta grabowski","addressee_status":"as in heading (no AM correction)","heading":"Do W J M C P. Lenkiewicza St[aros]ty Grabskiego d. 4. Januarij 1750. z Nieswiża","series":"Inne","persons":["Deputaci mozyrscy (grupa)"],"intermediaries":[],"places":["powiat mozyrski"],"institutions":["Sejmik gromniczny (deputacki)"],"topics":["Sejmiki (gromniczne, deputackie)","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Prośba o wykorzystanie popularności adresata na sejmiku gromnicznym mozyrskim.","certainty":"high","uncertain":2,"hand_change":false,"notes":"","text":"Do W J M C P. Lenkiewicza St[aros]ty Grabskiego\nd. 4. Januarij 1750. z Nieswiża\nZnaiąc przychylne WMPana ex veteri ku [na marginesie: AB]\nsobie serce, tym bardziey przez kiegozacyą [?]\nfirmo onego tenentudinis [?], attollo mnie w na-\ndziei, że WMP na następuiącym Seymiku\nGromnicznym Prześwietnego P[owia]tu Mozyrskiego\niako maiący tam magnam niewątpliwie popu-\nlaritatem suam, wszystkie tak swoie do u-\ntrzymania pomyślnego na nim skutku łożyć\nbędziesz conatus et studia, że nietylko nastą-\npi publicae expectationi satisfakcya, plausus\net gloria Przeświet[nemu] P[owia]tu a mnie zostanie\ningens desiderium powinszować obranym [na marginesie: Deputatom]\npubliczney usługi, iako recenseo oto do WMPa-\nna vota mea, tak piszę się etc"},{"n":45,"pages":"18","day":5,"language":"pol","addressee":"Repczyński [?], sędzia grodzki łucki","addressee_src":"Rep?iński, sędzia grodzki łucki","addressee_status":"as in heading (no AM correction)","heading":"Do W J Mci P. Repczinskiego [?] Sędziego Grodz[kiego] Łuckiego d. 5 Januarij 1750. Anno","series":"Seria łucka (5 I)","persons":["Krzywcowa","Łopott-Bykowski Józef, starosta bobrujski"],"intermediaries":[],"places":["Łuck"],"institutions":["Sąd grodzki łucki"],"topics":["Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria łucka: wstawiennictwo za Łopottem w sprawie z Krzywcową przed sądem grodzkim łuckim.","certainty":"medium","uncertain":3,"hand_change":false,"notes":"Nazwisko adresata niepewne: „Repczinski” [?].","text":"Do W J Mci P. Repczinskiego [?] Sędziego Grodz[kiego]\nŁuckiego d. 5 Januarij 1750. Anno\nz Nieswiża\n[na marginesie: +] Do sprawiedliwego WMcPana serca\nw ktorym zwykła zawsze sprawiedliwość\nświęta primum tenere locum, ucieka się\nJMcPan Łopott St[aros]ta Bobruyski MWPan\nw sprawie swoiey z JMcią Panią Krzywcową [?]\nw Prześwietnych Grodzie Łuckim deiudicari\nmaiącey, ażebyś tedy WMcPan pro tenentu-\ndine [?] swa ku mnie był Jemu iusta petenti\npraesidio et tutamine uniżenie proszę iestem\ncunctorum votorum etc:"},{"n":46,"pages":"18","day":5,"language":"pol","addressee":"Kucharski","addressee_src":"Kucharski","addressee_status":"as in heading (no AM correction)","heading":"Do JMPana Kucharskiego d 5 Janu[arii]","series":"Seria łucka (5 I)","persons":["Krzywcowa","Łopott-Bykowski Józef, starosta bobrujski"],"intermediaries":[],"places":["Łuck"],"institutions":["Sąd grodzki łucki"],"topics":["Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria łucka: wstawiennictwo za Łopottem w sprawie z Krzywcową przed sądem grodzkim łuckim.","certainty":"medium","uncertain":2,"hand_change":false,"notes":"","text":"Do JMPana Kucharskiego d 5 Janu[arii]\nz Nieswiża 1750 Anno.\n[na marginesie: +] Przypadaiącey w Grodzie Łuckim sprawie\nJMcPana Łopotta St[aros]ty Bobruyskiego\nMWMcPana z JeyMcią Panią Krzywcową [?]\nad diiudicationem, chciey WMcPan pro-\ndesse consilio et iuvamine suo w tey convenio [?]\nzostaiąc indesinent[er]."},{"n":47,"pages":"18-19","day":5,"language":"pol","addressee":"Czarnołuski, podstarości łucki","addressee_src":"Czarnołluski, podstarości łucki","addressee_status":"as in heading (no AM correction)","heading":"Do JMcPana Czarnołuskiego Podstarościego P[owia]tu Łuckiego z Nieswiża d 5 Janu[arii] 1750","series":"Seria łucka (5 I)","persons":["Krzywcowa","Łopott-Bykowski Józef, starosta bobrujski"],"intermediaries":[],"places":["Łuck"],"institutions":["Sąd grodzki łucki"],"topics":["Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria łucka: wstawiennictwo za Łopottem w sprawie z Krzywcową przed sądem grodzkim łuckim.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do JMcPana Czarnołuskiego Podstarościego\nP[owia]tu Łuckiego z Nieswiża d 5 Janu[arii] 1750\n[na marginesie: +] Wiem gdzie sprawiedliwość święta singula-\nre sobie zakłada [?] tutamen, recurrit do\nłaskawego serca WMcPana JMcPan\nŁopott St[aros]ta Bobruyski MWMcPan w sprawie\n[kustosz: swoiey]\nswoiey z JeyMcią Panią Krzywcową w Prze-\nświętnym Grodzie WMcPanow agitari ma-\niącey, ktoremu ażebyś był WMcPan propi-\ntio et tutelari Numine interponendo prozby\nmoie zostaiąc firmo voto etc."},{"n":48,"pages":"19","day":5,"language":"pol","addressee":"Majewski, pisarz grodzki łucki","addressee_src":"Majeski, pisarz grodzki łucki","addressee_status":"as in heading (no AM correction)","heading":"Do JMcPana Maiewskiego Pisarza Grodz[kiego] P[owia]tu Łuckiego. d 5 Janu[arii] 1750. A[nno]","series":"Seria łucka (5 I)","persons":["Krzywcowa","Łopott-Bykowski Józef, starosta bobrujski"],"intermediaries":[],"places":["Łuck"],"institutions":["Sąd grodzki łucki"],"topics":["Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria łucka: wstawiennictwo za Łopottem w sprawie z Krzywcową przed sądem grodzkim łuckim.","certainty":"high","uncertain":2,"hand_change":false,"notes":"","text":"Do JMcPana Maiewskiego Pisarza Grodz[kiego]\nP[owia]tu Łuckiego. d 5 Janu[arii] 1750. A[nno]\nW sprawie swoiey z JeyMcią Panią\nKrzywcową JMPan Łopott St[aros]ta Bo-\nbruyski MWMPan coram dignissimo\nWMWMPanow iudicio expediri maiącey\nszuka azylum w sprawiedliwym sercu\nWMcPana, y przez valido Jego proiec-\ntu [?] zaszczycać się auxilio, gdy y moie\ndo WMcPana używa interpozycyi łączę one [?];\nz tym upewnieniem żem iest ad quaeq[ue] officia\netc:"},{"n":49,"pages":"19","day":5,"language":"pol","addressee":"Macewicz, pułkownik pułku ulijńskiego","addressee_src":"Macewicz, pułkownik pułku ulijńskiego","addressee_status":"as in heading (no AM correction)","heading":"Do JMP. Macewicza Pułkownika Pułku Ulijńskiego [?] z Nieswiża d 5 Janu[arii]","series":"Seria łucka (5 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski"],"intermediaries":[],"places":[],"institutions":["Wojsko WXL"],"topics":["Wojsko, artyleria, nominacje wojskowe"],"summary":"Polecenie przydzielenia Łopottowi ludzi do konwoju (pułk ulijński [?]).","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do JMP. Macewicza Pułkownika\nPułku Ulijńskiego [?] z Nieswiża d 5 Janu[arii]\n1750 Anno. [skreśl.: z Nieswiża]\nNa requizycyą JMP. Łopotta St[aros]ty\nBobruyskiego wiele będzie potrzebował\ndo konwoiu ludzi, tyle [nad wierszem: mu] WMPan dodasz,\nzalecam etc:"},{"n":50,"pages":"20","day":5,"language":"pol","addressee":"Abramowicz Andrzej, pisarz grodzki wileński","addressee_src":"Abramowicz, pisarz ziemski wileński","addressee_status":"identified (AM)","heading":"Do JmPana Abramowicza Pisarza Ziem[skiego] Wilen[skiego] z Nieswiża d 5ta Januarij 1750 Anno","series":"Inne","persons":["Lenkiewicz, starosta grabowski"],"intermediaries":[],"places":[],"institutions":[],"topics":["Poczta, przesyłanie listów i wiadomości"],"summary":"Prośba o szybkie przesłanie listu do Lenkiewicza w znanym interesie.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do JmPana Abramowicza Pisarza Ziem[skiego] Wilen[skiego]\nz Nieswiża d 5ta Januarij 1750 Anno\nDo obligacyi moich ktore oretenus wyrazi-\nłem WMWMPanu addo calcar nowey obliga-\ncyi uniżenie proszę ażebyś List do Jm Pa-\nna Lenkiewicza w wiadomym Interessie quam\ncitissime do mnie [skreśl.: …] [nad wierszem: przysłał], wierząc temu\nżem iest constanti voto etc"},{"n":51,"pages":"20","day":5,"language":"pol","addressee":"Pilchowska, pułkownikowa JKM","addressee_src":"Pilchowska, pułkownikowa JKM","addressee_status":"as in heading (no AM correction)","heading":"Do JmciPani Pilchowskiey Pułkownikowey JKMci z Nieswiża d 5 Januarij","series":"Inne","persons":["Petersen Karol, obersztlejtnant","Pilchowska Magdalena Małgorzata, pułkownikówna"],"intermediaries":[],"places":[],"institutions":[],"topics":["Małżeństwo, zaręczyny","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Wstawiennictwo za Petersonem starającym się o rękę córki adresatki.","certainty":"high","uncertain":1,"hand_change":false,"notes":"","text":"Do JmciPani Pilchowskiey Pułkownikowey JKMci\nz Nieswiża d 5 Januarij\n[na marginesie: +] Znakomite y godne zawsze estymacyi wrodzonych przy-\nmiotow własności W Jmci Pana Petersona Obersztley-\ntnanta Kor[pusu] [?] B W W X Litt wiem że y u WMWMPani swo-\nią znaydą zaletę y rekognicyą, ktory maiąc dyspenso-\nwane żądze y intencye swoie do dożywotniey przyiaź-\nni z JmcPanną Pułkownikowną, aby mogł macie-\nrzyński WMWMPani ziednać dla siebie respekt, y\nsynowskiego na sobie zaszczytu nosić tytuł, życzę\ny Ja moią uniżoną za nim interpozycyą upew-\nniaiąc że skutecznieysze da dowody nieustaiącey do\ndalszych usług w pełnieniu wszelkich rozkazow\nobligacyi swoich, a Ja zostaię z zupełną obserwancyą"},{"n":52,"pages":"20-21","day":5,"language":"pol","addressee":"Zienkowicz Michał Jan, biskup wileński","addressee_src":"Zienkowicz Michał Jan, biskup wileński","addressee_status":"as in heading (no AM correction)","heading":"Do JO X[ię]dza Zienkowicza Biskupa Wileńskiego z Nieswiża d 5 [?] Janu[arii]","series":"Inne","persons":["Petersen Karol, obersztlejtnant","Pilchowska Magdalena Małgorzata, pułkownikówna"],"intermediaries":[],"places":["Olszewice [?] (parafia)"],"institutions":["Kościół (biskupstwo)"],"topics":["Małżeństwo, zaręczyny","Religia, Kościół, modlitwa","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Prośba o biskupią zgodę i błogosławieństwo (indult) na ślub Petersona.","certainty":"high","uncertain":3,"hand_change":false,"notes":"","text":"Do JO X[ię]dza Zienkowicza Biskupa Wileńskiego\nz Nieswiża d 5 [?] Janu[arii]\nSkłonione maiąc vota et Intentiones do dożywot-\nniey przyiaźni W JP Peterson Obersztleytnant Kor[pusu] [?]\nB W X Litt z JeyMcPanną Magdaleną Małgo-\nrzatą Biberszteynowną Pilchowską Pułkownikowną\nz Parafij Olszewickiey [?], aby mogł prosperiori cursu\ncoronare desideria swoie, za łaską moiey interpozycyi\ndo JWWMPana, ktorą intra tenerrimos wyrażaiąc\ncultus, uniżenie upraszam abyś mu raczył JWWMPan\npastoralem assensum et benedictionem przez swoy in-\ndult na to praebere zasłuży sam omni obsequiorum\ngenere taką uczynność JWWMPanu, a Ja w nie-\nustaiących obowiązkach zostawać nie przestanę ad\nomnes nutus etc"},{"n":53,"pages":"21","day":5,"language":"pol","addressee":"Rymaszewski, administrator księstwa nieświeskiego","addressee_src":"Rymaszewski, ekonom ołycki","addressee_status":"as in heading (no AM correction)","heading":"Do Jmci Pa[na] Rymaszewskiego Administratora Xięstwa Nieswizkiego d 5 Januarij w Nieswiżu","series":"Inne","persons":["Młodeccy, rotmistrzowie nowogródzcy"],"intermediaries":[],"places":["Olceda [?]","województwo nowogródzkie"],"institutions":["Skarb Radziwiłłowski"],"topics":["Dobra ziemskie, zastaw, inwentarz","Płatności, długi, zaległości"],"summary":"Polecenie sporządzenia inwentarza i oddania folwarku w zastaw Młodeckim za 7000 zł.","certainty":"medium","uncertain":1,"hand_change":false,"notes":"Rękopis: „Administrator Xięstwa Nieswizkiego”; tabela: „ekonom ołycki”.","text":"Do Jmci Pa[na] Rymaszewskiego Administratora\nXięstwa Nieswizkiego d 5 Januarij w Nieswiżu\nInwentarz Olcedy [?] sporządź WMPan, y poday w za-\nstawną roczną possessyą JmPP Młodeckim Rotmistrzom\nWdztwa Nowogrodzkiego vigore Prawa ode mnie danego w\nsummie 7000 Złł Pol[skich], cokolwiek zas nad tę summę\ninsuper pokaże się ex fundo Intraty excypuy WMP.\ntę superatę Inwentarzem do Skarbu mego. Zalecam.\n[na marginesie: B]"},{"n":54,"pages":"21","day":5,"language":"pol","addressee":"Generał JKM województwa mińskiego (anonim)","addressee_src":"generał JKM Mir? [przekrześlony]","addressee_status":"as in heading (no AM correction)","heading":"Do Jenerała JKMci Wdztwa Minskiego d 5 Januarij z Nieswiża","series":"Inne","persons":["Młodeccy, rotmistrzowie nowogródzcy"],"intermediaries":[],"places":["Olceda [?]","województwo mińskie","województwo nowogródzkie"],"institutions":[],"topics":["Dobra ziemskie, zastaw, inwentarz","Płatności, długi, zaległości"],"summary":"Polecenie dla jenerała (woźnego [?]) województwa mińskiego: wwiązać Młodeckich w zastawną posesję folwarku Olceda za 7000 zł.","certainty":"medium","uncertain":1,"hand_change":false,"notes":"Rękopis: „Jenerał JKMci Wdztwa Minskiego” (jenerał = woźny sądowy [?]); tabela: „generał JKM Mir? [przekreślony]”.","text":"Do Jenerała JKMci Wdztwa Minskiego d\n5 Januarij z Nieswiża\nMasz WMP vigore Prawa ode mnie danego Folwark\nmoy Olcedę [?] w Wdztwie Minskim sytuowany podać\nna terminie w tymże Prawie wyrażonym w sum-\nmie 7000 Złł Pol[skich] w zastawną roczną possessyą JPP\nMłodeckim Rotmistrzom Wdztwa Nowogrodz[kiego] obligowany\nbędąc etc"},{"n":55,"pages":"21","day":6,"language":"pol","addressee":"Łopott-Bykowski Józef, starosta bobrujski","addressee_src":"Łopott, starosta bobrujski","addressee_status":"identified (AM)","heading":"Do JMcPana Łopotta St[aros]ty Bobruyskiego d 6. Janu[arii] 1750 Anno z Nieswiża","series":"Inne","persons":["Radziwiłłowa Franciszka Urszula z Wiśniowieckich","Radziwiłł Janusz Tadeusz","Wiszczyński M. Karol, bunczuczny buławy w.lit."],"intermediaries":["Wiszczyński M. Karol, bunczuczny buławy w.lit."],"places":["Pińsk","Rzeczyca","Słuck"],"institutions":["Sejmik gromniczny (deputacki)"],"topics":["Kariera synów i krewnych","Sejmiki (gromniczne, deputackie)","Odesłanie do ustnej relacji posłańca"],"summary":"Decyzja: syn i żona jadą nie do Pińska, lecz do Rzeczycy; prośba o poparcie kandydatury syna.","certainty":"medium","uncertain":2,"hand_change":false,"notes":"","text":"Do JMcPana Łopotta St[aros]ty Bobruyskiego\nd 6. Janu[arii] 1750 Anno z Nieswiża\nWziąłem rezolucyą nieposyłać iuż Xcia\nSyna mego y Xiężney Żony moiey do Pinska\nale do Rzeczycy, w ktorey że WMcPan singu-\nlari tameczny[c]h Obywatelow zaszczycasz\nsię popularitate et amore, z tey przyczyny idę\nz uniżoną prozbą moią enixius prosząc aże-\nbyś kredytem swoim iuvare prospero eventu\nraczył Intencyą Syna mego, dla czego y Bo-\nnę [?] zostawić kazałem do Słucka przez kto-\nrą pragnę mieć hoc in negotio rezolucyą\nJego, in reliquo zaś na ustną JmcPana Wierzczyń-\nskiego [?] Bunczucznego mego referuię się remonstracyą\nzostaiąc sam ad quaeq[ue] vota. etc."},{"n":56,"pages":"22","day":6,"language":"pol","addressee":"Tyszkiewicz, ciwun wileński","addressee_src":"Tyszkiewicz, ciwun wileński","addressee_status":"as in heading (no AM correction)","heading":"Do Jm P Tyszkiewicza Ciwuna Wileńsk[ie]g[o] d 6ta Jan[uarii] z Niesw[iża]","series":"Inne","persons":[],"intermediaries":[],"places":["Wilno","województwo wileńskie"],"institutions":["Sejmik gromniczny (deputacki)"],"topics":["Sejmiki (gromniczne, deputackie)","Wezwanie do przyjazdu, konferencja","Dobro publiczne, spokój w prowincji"],"summary":"Zapowiedź przyjazdu Rybeńki do Wilna na sejmik gromniczny; prośba o obecność ciwuna.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do Jm P Tyszkiewicza Ciwuna Wileńsk[ie]g[o] d 6ta Jan[uarii] z Niesw[iża]\nPonieważ firma intentione mea powziołem u siebie rezolucyą\nokoło czasu Seymikow Gromnicznych blisko następuiących\ncondescendere niechybnie do Wilna, gdzie bytność WMPana\niako pierwszego tego Wdztwa Urzędnika iest praeoportu-\nna et desiderabilis, tak y mnie iest promotivo recense-\nre uniżone moie prozby, ażebyś na Seymik ten Wdz-\ntwa Wileńskiego infallibiliter sam ziechać raczył, z kto-\nrym iako mi będzie voti desiderabilis łączyć conatus\nmeos ad optatos eventus Seymiku tego, aby publico\ndesiderio satisfakcya, niemnieyże cedat przez to\nplausus et gloria Prześwietnemu Wdztwu, tak\nexposcendo ad haec vota mea niechybney WMPana\nna tamtym mieyscu bytności zostawam sam voto\nnunquam desituro."},{"n":57,"pages":"22","day":6,"language":"pol","addressee":"Tyszkiewicz Antoni Dominik, bp żmudzki","addressee_src":"Tyszkiewicz, bp żmudzki","addressee_status":"identified (AM)","heading":"Do JW Jm X[ię]dza Tyszkiewicza Biskupa Żmudzkiego z Nieswiża d 6ta Januarij.","series":"Inne","persons":["Krzyłkowski [?], starosta"],"intermediaries":[],"places":["Żmudź"],"institutions":["Trybunał Główny WXL"],"topics":["Trybunał Główny Litewski","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Propozycja, by starosta ubiegał się o deputację żmudzką do Trybunału; prośba o poparcie biskupa.","certainty":"medium","uncertain":2,"hand_change":false,"notes":"","text":"Do JW Jm X[ię]dza Tyszkiewicza Biskupa Żmudzkiego\nz Nieswiża d 6ta Januarij.\nDa mi niewątpię świadectwo prawdziwe Jm Pan [nad wierszem: Starosta] Krzył-\nkowski [?] MWMPan, w iakich mię zastał dyspozycyach,\nktoremu całym sercem iako usłużyć pragnąłem, tak mi\nna mnie takowy zawisł interes, ocoćko [?] iednak z usłu-\ngą moią w każdym skinieniu oczekiwam Jm P Staro-\nsty, ktorego pragnąc widzieć ambigentem coraz ad\naltiora, zdałoby mi się, ażeby o funkcyą Deputac-\nką ze Żmudzi na następuiący Trybunał W X Litt\nstarał się, do czego niewątpię dodać WMPan raczysz\ncompulsus suos, z czego iako cordicitus cieszył-\nbym się, tak nieskończenie iestem cum maximo cultu"},{"n":58,"pages":"23","day":8,"language":"pol","addressee":"Górski, sekretarz j.o. ks. Radziwiłła krajczego w.lit.","addressee_src":"Górski, sekretarz j.o. ks. Radziwiłła krajczego w.lit.","addressee_status":"as in heading (no AM correction)","heading":"Do Jmci Pana Gorskiego Sekretarza JOXcia Jmci Radziwiłła Krayczego W X Litt d 8 Januarij z Nieswiża","series":"Inne","persons":["Radziwiłł Marcin Mikołaj, krajczy w.lit."],"intermediaries":[],"places":[],"institutions":[],"topics":["Wezwanie do przyjazdu, konferencja"],"summary":"Wezwanie sekretarza krajczego do przyjazdu.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do Jmci Pana Gorskiego Sekretarza JOXcia Jmci Radzi-\nwiłła Krayczego W X Litt d 8 Januarij z Nieswiża\nJest tego Interess ażebyś się WMWMPan ze mną widział\ndla czego czekam na przybycie WMWMPana sam\nbędąc etc"},{"n":59,"pages":"23","day":8,"language":"pol","addressee":"Wołłowicz Kazimierz Józef, marszałek słonimski","addressee_src":"Wołłowicz, marszałek słonimski","addressee_status":"identified (AM)","heading":"Do WJmPana Wołłowicza Marszałka P[owia]tu Słonimskiego d 8 Januarij z Nieswiża","series":"Seria słonimska (8 I)","persons":["NN, kadet regimentu konnego królewicza"],"intermediaries":[],"places":["powiat piński"],"institutions":["Regiment Konny Królewicza"],"topics":["Przemoc, zabójstwo, napaść","Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria słonimska: prośba o polubowne załatwienie sprawy zabójstwa popełnionego przypadkiem przez kadeta.","certainty":"medium","uncertain":1,"hand_change":false,"notes":"","text":"Do WJmPana Wołłowicza Marszałka P[owia]tu Sło-\nnimskiego d 8 Januarij z Nieswiża\nJak znam prawdziwe WMWMPana ku mnie [skreśl.: serce] ad-\ndykcye, tak poufałe do niego niosę prozby za Kadetem\nKntu [?] Pinskiego, casu w tym nieszczęściu zostaiącym, ex-\nposcendo dla niego łaski WMWMPana ażebyś satius\ntę sprawę per amicabilem compositionem uspokoić\nstarał się, będzie się znał upewniam pro tanto facto ad\nimmoritura WMWMPa obsequia, a Ja spondeo za\nsiebie żem iest infinito corde etc"},{"n":60,"pages":"23","day":8,"language":"pol","addressee":"Połubiński Krzysztof, sędzia ziemski słonimski","addressee_src":"Połubiński, sędzia ziemski słonimski","addressee_status":"identified (AM)","heading":"Do W JPana Połubinskiego Sędziego Ziem[skiego] Pow[ia]tu Słonimskiego d 8 Januarij z Nieswiża","series":"Seria słonimska (8 I)","persons":["NN, kadet regimentu konnego królewicza"],"intermediaries":[],"places":[],"institutions":["Regiment Konny Królewicza"],"topics":["Przemoc, zabójstwo, napaść","Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria słonimska: prośba o polubowne załatwienie sprawy zabójstwa popełnionego przypadkiem przez kadeta.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W JPana Połubinskiego Sędziego Ziem[skiego] Pow[ia]tu\nSłonimskiego d 8 Januarij z Nieswiża\nNieodważyłbym się pewnie tutari crimen homicidij Ka-\ndeta Regimentu Konnego Nayiaśnieyszego Krolewicza Jmci,\ngdybym conscius nie był, że go non praemeditate, ale tyl-\nko loco casu popełnił, ex hoc tedy motivo, niosę za nim\nnayuniżeńszą do WMWMPa instancyą enixe upraszā-\niąc: ażebyś interposita authoritate sua, interess ten pogo-\ndzić raczył, wierząc firma fide żem iest indesinenti voto etc"},{"n":61,"pages":"23","day":8,"language":"pol","addressee":"Jeśman Szynkowski Karol Damian, pisarz ziemski słonimski","addressee_src":"Jeśman, pisarz ziemski słonimski","addressee_status":"identified (AM)","heading":"Do WJPana Jesmana Pisarza Ziem[skiego] Pow[ia]tu Słonimskiego z Nieswiża d 8 Januarij","series":"Seria słonimska (8 I)","persons":["NN, kadet regimentu konnego królewicza"],"intermediaries":[],"places":[],"institutions":["Regiment Konny Królewicza"],"topics":["Przemoc, zabójstwo, napaść","Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria słonimska: prośba o polubowne załatwienie sprawy zabójstwa popełnionego przypadkiem przez kadeta.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do WJPana Jesmana Pisarza Ziem[skiego] Pow[ia]tu Słonimskiego\nz Nieswiża d 8 Januarij\nNieodmiennemu WMWMPana ku mnie confisus ser-\ncu, imploro tey Jego dla Kadeta Reg[imen]tu Konnego Nayiaś-\nnieyszego Krolewicza Jmci casualiter w teraźnieyszym nie-\nszczęściu zostaiącego łaski y protekcyi, ażebyś mediante\nauthoritate sua, partem instigantem ad compositionem\namicabilem nakłonić raczył, za co znaczne upewniam\nbędzie do dozgonnych WMWMPanu usług, a Ja pisać\nsię nie przestanę quo supervixero etc"},{"n":62,"pages":"24","day":8,"language":"pol","addressee":"Przecławski Gedeon Glaubicz, podsędek słonimski","addressee_src":"Krzesławski, podsędek słonimski","addressee_status":"identified (AM)","heading":"Do W JmPana Krzesławskiego Podsędka P[owia]tu Słonim[skiego] z Nieswiża d 8 Januarij","series":"Seria słonimska (8 I)","persons":["NN, kadet regimentu konnego królewicza"],"intermediaries":[],"places":[],"institutions":["Regiment Konny Królewicza"],"topics":["Przemoc, zabójstwo, napaść","Spory sądowe i arbitraż","Protekcja, rekomendacja, wstawiennictwo"],"summary":"Seria słonimska: prośba o polubowne załatwienie sprawy zabójstwa popełnionego przypadkiem przez kadeta.","certainty":"high","uncertain":0,"hand_change":false,"notes":"","text":"Do W JmPana Krzesławskiego Podsędka P[owia]tu Słonim[skiego]\nz Nieswiża d 8 Januarij\nRozumiem że to y samemu WMWMPanu aliunde do-\nbrze wiadomo: iż Kadet Reg[imen]tu Konnego Nayiaśnieyszego\nKrolewicza Jmci non vitio aliquo, ale solo fato w teraźniey-\nsze popadł nieszczęście z ktorego iako go łaskawa WMW-\nMPana protekcya łatwo podźwignąć może, tak śmiem\niako nayuniżeniey upraszać, ażebyś nie dopuszczaiąc\ntey sprawy ad strepitum Iuris, raczey ią amicabiliter\npomiarkować starał się; ktora łaska będzie upewniam\ny mnie samemu wdzięczna, iako temu ktory iest\net voto et corde etc"},{"n":63,"pages":"24","day":9,"language":"pol","addressee":"Dernałowicz, sędzia wojskowy","addressee_src":"Dernałowicz, sędzia wojskowy","addressee_status":"as in heading (no AM correction)","heading":"Do W JMcPana Dernałowicza Sędziego Woyskowego d. 9. Janu[arii] z Niesw[iża] 1750","series":"Seria rzeczycka (9 I)","persons":["Łopott-Bykowski Józef, starosta bobrujski","Wiszczyński M. Karol, bunczuczny buławy w.lit."
